<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Paint — Flocade</title>
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0221;
      --panel: #1a0f38;
      --panel2: #241155;
      --pink: #ff2e88;
      --cyan: #00f0ff;
      --yellow: #ffe600;
      --text: #efe9ff;
      --dim: #a396c9;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; cursor: pointer; color: inherit; }

    .topbar {
      flex: none; display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.8rem; background: var(--panel); border-bottom: 2px solid var(--panel2);
    }
    .navBtn {
      background: none; border: 2px solid var(--panel2); border-radius: 10px;
      color: var(--cyan); font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem; padding: 0.5rem 0.55rem; text-decoration: none; white-space: nowrap;
    }
    .hud {
      flex: 1; display: flex; justify-content: center; gap: 1rem;
      font-family: 'Press Start 2P', monospace; font-size: 0.58rem; color: var(--cyan);
    }
    .hud b { color: var(--yellow); }

    #stage { flex: 1; min-height: 0; position: relative; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }

    .board {
      position: absolute; top: 8px; right: 8px;
      background: rgba(26,15,56,0.82); border: 2px solid var(--panel2);
      border-radius: 12px; padding: 0.4rem 0.55rem; font-size: 0.72rem; line-height: 1.6;
      pointer-events: none; min-width: 104px;
    }
    .board .me { color: var(--yellow); font-weight: 700; }

    .overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6,1,16,0.88); padding: 1.2rem;
    }
    .overlay[hidden] { display: none; }
    .card {
      background: var(--panel); border: 3px solid var(--pink); border-radius: 22px;
      padding: 1.3rem; max-width: 25rem; width: 100%; text-align: center;
      box-shadow: 0 0 34px rgba(255,46,136,0.35);
    }
    .card h1 {
      font-family: 'Press Start 2P', monospace; color: var(--pink);
      font-size: clamp(1rem, 5vw, 1.5rem); line-height: 1.6;
      text-shadow: 0 0 18px rgba(255,46,136,0.7);
    }
    .card p { font-size: 0.92rem; color: var(--text); margin-top: 0.7rem; line-height: 1.55; }
    .card p.small { color: var(--dim); font-size: 0.84rem; }
    .picks {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem; margin-top: 0.9rem;
    }
    .pick {
      background: var(--panel2); border: 3px solid transparent; border-radius: 14px;
      padding: 0.45rem 0.2rem 0.4rem; display: flex; flex-direction: column;
      align-items: center; gap: 0.25rem;
    }
    .pick canvas { width: 58px; height: 58px; }
    .pick .nm { font-family: 'Press Start 2P', monospace; font-size: 0.4rem; line-height: 1.4; }
    .pick.on { border-color: var(--yellow); background: var(--panel3, #32196e); }
    .btn {
      background: var(--pink); color: #fff; border: none; border-radius: 999px;
      font-family: 'Press Start 2P', monospace; font-size: 0.7rem;
      padding: 0.9rem 1rem; width: 100%; margin-top: 1rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.35);
    }
    .btn.ghost { background: none; border: 2px solid var(--panel2); box-shadow: none; }
    .btn:active { transform: translateY(3px); box-shadow: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="navBtn" href="../../">&larr; ARCADE</a>
    <div class="hud">
      <span>PAINTED <b id="hudPct">0.0%</b></span>
      <span>BEST <b id="hudBest">0.0%</b></span>
    </div>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div class="board" id="board"></div>

    <div class="overlay" id="startCard">
      <div class="card">
        <h1>PLAY PAINT</h1>
        <p class="small">Paint the ground by looping around it. Come back to your own colour to fill it in — but if anyone runs over your wet paint trail, they pop!</p>
        <div class="picks" id="picks"></div>
        <p class="small" id="pickBlurb">Unicorns paint in <b>rainbow</b>.</p>
        <button class="btn" id="playBtn" type="button">PLAY!</button>
      </div>
    </div>

    <div class="overlay" id="endCard" hidden>
      <div class="card">
        <h1 id="endTitle">POP!</h1>
        <div style="font-size:2.2rem" id="endEmoji">💥</div>
        <p id="endBody"></p>
        <button class="btn" id="againBtn" type="button">PLAY AGAIN</button>
        <button class="btn ghost" id="changeBtn" type="button">CHANGE ANIMAL</button>
      </div>
    </div>
  </div>

  <script>
  'use strict';

  // ==========================================================
  // Play Paint — by Flo.
  // "Basically the same thing as Paper.io. But every one is either
  //  a unicorn or a pig. The unicorn's colour is rainbow and the
  //  pig's colour is pink."
  // ==========================================================

  const GW = 110, GH = 110;      // the field, in cells
  const VIEW = 34;               // roughly how many cells fit across the screen
  const STEP = 0.075;            // seconds per cell of movement
  const BOTS = 5;
  const WIN_PCT = 45;

  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const owner = new Uint8Array(GW * GH);      // 0 = unpainted, else player id
  const trailOf = new Uint8Array(GW * GH);    // 0 = no trail, else player id
  const idx = (x, y) => y * GW + x;
  const inGrid = (x, y) => x >= 0 && y >= 0 && x < GW && y < GH;

  const canvas = $('game'), ctx = canvas.getContext('2d');
  const stage = $('stage');

  let players = [], me = null, running = false, best = 0;
  let camX = GW / 2, camY = GH / 2, cell = 20, t0 = 0;
  let pops = [];

  try { best = parseFloat(localStorage.getItem('flocade-play-paint-best') || '0') || 0; } catch {}
  $('hudBest').textContent = best.toFixed(1) + '%';

  // ---------- looks ----------
  // Every animal lives in one table: how its paint looks on the ground, what
  // colour it pops, and how to draw its face. Adding an animal is one entry.
  const mod = (n, m) => ((n % m) + m) % m;
  // A steady per-tile speckle, so cherries and cat patches land in the same
  // place every time instead of shimmering as you walk past.
  function hash2(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  // Bots get a slightly different shade of their own animal's colours, so two
  // capybaras are still telling apart without either stopping being a capybara.
  const HSL = (h, s, l, tint) =>
    'hsl(' + h + ',' + s + '%,' + Math.max(16, Math.min(94, l + (tint % 4) * 3)) + '%)';

  function drawUnicorn(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    c.fillStyle = '#fff8fc';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    for (let i = 0; i < 6; i++) {
      c.fillStyle = 'hsl(' + ((i * 60 + t * 90 + tint) % 360) + ',90%,66%)';
      c.beginPath();
      c.ellipse(-r * 0.62 + Math.sin(i) * 2, -r * 0.7 + i * r * 0.28, r * 0.42, r * 0.2, 0.5, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#ffe600';
    c.beginPath();
    c.moveTo(-r * 0.16, -r * 0.82); c.lineTo(0, -r * 1.7); c.lineTo(r * 0.16, -r * 0.82);
    c.closePath(); c.fill();
    c.fillStyle = '#fff8fc';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.62, -r * 0.62, r * 0.2, r * 0.3, s * 0.5, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#3a2a4d';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.32, -r * 0.05, r * 0.11, r * 0.15, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#ffc0dd';
    c.beginPath(); c.ellipse(0, r * 0.42, r * 0.36, r * 0.24, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  function drawPig(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    c.fillStyle = 'hsl(' + (335 + tint % 25) + ',80%,74%)';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    [-1, 1].forEach(s => {
      c.fillStyle = 'hsl(' + (335 + tint % 25) + ',72%,64%)';
      c.beginPath();
      c.moveTo(s * r * 0.3, -r * 0.72); c.lineTo(s * r * 0.86, -r * 1.12); c.lineTo(s * r * 0.82, -r * 0.42);
      c.closePath(); c.fill();
    });
    c.fillStyle = 'hsl(' + (335 + tint % 25) + ',85%,84%)';
    c.beginPath(); c.ellipse(0, r * 0.3, r * 0.46, r * 0.34, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#a85a7a';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.16, r * 0.3, r * 0.08, r * 0.12, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#3a2a4d';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.36, -r * 0.24, r * 0.11, r * 0.14, 0, 0, Math.PI * 2); c.fill(); });
    c.restore();
  }
  function drawAxolotl(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    // frilly gills, three a side, wafting
    for (const s of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const a = (-0.5 + i * 0.5) + Math.sin(t * 2 + i + s) * 0.12;
        const gx = s * r * 0.78, gy = -r * 0.32 + i * r * 0.36;
        c.strokeStyle = '#ff9ec7'; c.lineWidth = r * 0.12; c.lineCap = 'round';
        c.beginPath(); c.moveTo(s * r * 0.5, gy);
        c.lineTo(gx + s * Math.cos(a) * r * 0.34, gy + Math.sin(a) * r * 0.2); c.stroke();
        c.fillStyle = '#ffc2de';
        c.beginPath();
        c.arc(gx + s * Math.cos(a) * r * 0.42, gy + Math.sin(a) * r * 0.26, r * 0.19, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.fillStyle = '#ffd9ea';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    // pale stripes, the colour it paints in
    c.save();
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.clip();
    c.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = -2; i <= 2; i++) c.fillRect(i * r * 0.52 - r * 0.13, -r, r * 0.26, r * 2);
    c.restore();
    c.fillStyle = '#3a2a4d';
    [-1, 1].forEach(s => { c.beginPath(); c.arc(s * r * 0.34, -r * 0.1, r * 0.1, 0, Math.PI * 2); c.fill(); });
    c.strokeStyle = '#e0709e'; c.lineWidth = r * 0.1; c.lineCap = 'round';
    c.beginPath(); c.arc(0, r * 0.18, r * 0.3, 0.35, Math.PI - 0.35); c.stroke();
    c.restore();
  }
  function drawCapybara(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    [-1, 1].forEach(s => {
      c.fillStyle = '#4f321b';
      c.beginPath(); c.ellipse(s * r * 0.6, -r * 0.72, r * 0.22, r * 0.19, 0, 0, Math.PI * 2); c.fill();
    });
    c.fillStyle = '#6b4423';
    c.beginPath(); c.ellipse(0, 0, r, r * 0.94, 0, 0, Math.PI * 2); c.fill();
    // the cherry it paints with, balanced on its head
    c.strokeStyle = '#3f8f5a'; c.lineWidth = r * 0.08; c.lineCap = 'round';
    c.beginPath(); c.moveTo(r * 0.1, -r * 0.95); c.quadraticCurveTo(r * 0.3, -r * 1.4, r * 0.02, -r * 1.5); c.stroke();
    c.fillStyle = '#e02a3c';
    c.beginPath(); c.arc(r * 0.06, -r * 1.12, r * 0.26, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.5)';
    c.beginPath(); c.arc(-r * 0.02, -r * 1.2, r * 0.07, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#8a5c33';
    c.beginPath(); c.ellipse(0, r * 0.42, r * 0.54, r * 0.3, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#2e1c0f';
    c.beginPath(); c.ellipse(0, r * 0.3, r * 0.18, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    // sleepy eyes
    c.strokeStyle = '#2e1c0f'; c.lineWidth = r * 0.11;
    [-1, 1].forEach(s => {
      c.beginPath(); c.arc(s * r * 0.38, -r * 0.2, r * 0.15, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
    });
    c.restore();
  }
  function drawPenguin(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    c.fillStyle = '#243b5a';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#7ec8f0';
    c.beginPath(); c.ellipse(-r * 0.34, -r * 0.42, r * 0.3, r * 0.2, -0.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#f4fbff';
    c.beginPath(); c.ellipse(0, r * 0.16, r * 0.66, r * 0.7, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#243b5a';
    [-1, 1].forEach(s => { c.beginPath(); c.arc(s * r * 0.3, -r * 0.14, r * 0.13, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#ff9e3d';
    c.beginPath();
    c.moveTo(-r * 0.22, r * 0.24); c.lineTo(r * 0.22, r * 0.24); c.lineTo(0, r * 0.62);
    c.closePath(); c.fill();
    c.restore();
  }
  function drawCat(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    [-1, 1].forEach(s => {
      c.fillStyle = '#e08a3c';
      c.beginPath();
      c.moveTo(s * r * 0.3, -r * 0.74); c.lineTo(s * r * 0.82, -r * 1.24); c.lineTo(s * r * 0.86, -r * 0.4);
      c.closePath(); c.fill();
      c.fillStyle = '#ffc2a0';
      c.beginPath();
      c.moveTo(s * r * 0.42, -r * 0.74); c.lineTo(s * r * 0.72, -r * 1.04); c.lineTo(s * r * 0.74, -r * 0.5);
      c.closePath(); c.fill();
    });
    c.fillStyle = '#e08a3c';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff6ea';
    c.beginPath(); c.ellipse(0, r * 0.38, r * 0.58, r * 0.4, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(0, -r * 0.55, r * 0.3, r * 0.22, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#fff6ea'; c.lineWidth = r * 0.06; c.lineCap = 'round';
    [-1, 1].forEach(s => {
      for (let i = -1; i <= 1; i++) {
        c.beginPath(); c.moveTo(s * r * 0.4, r * 0.34);
        c.lineTo(s * r * 1.12, r * 0.34 + i * r * 0.26); c.stroke();
      }
    });
    c.fillStyle = '#3f9e4a';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.34, -r * 0.14, r * 0.13, r * 0.17, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#2a2033';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.34, -r * 0.14, r * 0.05, r * 0.16, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#ff8fb1';
    c.beginPath();
    c.moveTo(-r * 0.12, r * 0.24); c.lineTo(r * 0.12, r * 0.24); c.lineTo(0, r * 0.4);
    c.closePath(); c.fill();
    c.restore();
  }
  function drawTiger(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    [-1, 1].forEach(s => {
      c.fillStyle = '#ff8c1a';
      c.beginPath(); c.arc(s * r * 0.68, -r * 0.68, r * 0.26, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#2a2033';
      c.beginPath(); c.arc(s * r * 0.68, -r * 0.68, r * 0.12, 0, Math.PI * 2); c.fill();
    });
    c.fillStyle = '#ff8c1a';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff3e0';
    c.beginPath(); c.ellipse(0, r * 0.44, r * 0.56, r * 0.36, 0, 0, Math.PI * 2); c.fill();
    c.save();
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.clip();
    c.strokeStyle = '#241a12'; c.lineWidth = r * 0.1; c.lineCap = 'round';
    [-1, 1].forEach(s => {
      for (let i = 0; i < 3; i++) {          // down the forehead
        const bx = s * (r * 0.26 + i * r * 0.25);
        c.beginPath();
        c.moveTo(bx, -r * 1.05);
        c.quadraticCurveTo(bx + s * r * 0.12, -r * 0.72, bx + s * r * 0.05, -r * 0.4);
        c.stroke();
      }
      for (let i = 0; i < 2; i++) {          // and across the cheeks
        c.beginPath();
        c.moveTo(s * r * 0.62, r * 0.02 + i * r * 0.26);
        c.lineTo(s * r * 1.05, r * 0.08 + i * r * 0.28);
        c.stroke();
      }
    });
    c.restore();
    c.fillStyle = '#ffe600';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.36, -r * 0.1, r * 0.14, r * 0.15, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#2a2033';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.36, -r * 0.1, r * 0.06, r * 0.14, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#2a2033';
    c.beginPath();
    c.moveTo(-r * 0.15, r * 0.3); c.lineTo(r * 0.15, r * 0.3); c.lineTo(0, r * 0.48);
    c.closePath(); c.fill();
    c.strokeStyle = '#2a2033'; c.lineWidth = r * 0.06;
    c.beginPath(); c.arc(-r * 0.16, r * 0.52, r * 0.17, -0.2, Math.PI - 0.6); c.stroke();
    c.beginPath(); c.arc(r * 0.16, r * 0.52, r * 0.17, 0.6, Math.PI + 0.2); c.stroke();
    c.restore();
  }
  function drawSloth(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    c.fillStyle = '#c49a6c';
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e8d3b4';
    c.beginPath(); c.ellipse(0, r * 0.12, r * 0.72, r * 0.66, 0, 0, Math.PI * 2); c.fill();
    // the sleepy mask
    c.fillStyle = '#8a5a3b';
    [-1, 1].forEach(s => {
      c.beginPath(); c.ellipse(s * r * 0.36, -r * 0.16, r * 0.3, r * 0.24, s * 0.35, 0, Math.PI * 2); c.fill();
    });
    c.fillStyle = '#2a2033';
    [-1, 1].forEach(s => { c.beginPath(); c.arc(s * r * 0.36, -r * 0.14, r * 0.13, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#fff';
    [-1, 1].forEach(s => { c.beginPath(); c.arc(s * r * 0.32, -r * 0.19, r * 0.05, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#5c3a24';
    c.beginPath(); c.ellipse(0, r * 0.3, r * 0.14, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#5c3a24'; c.lineWidth = r * 0.08; c.lineCap = 'round';
    c.beginPath(); c.arc(0, r * 0.3, r * 0.26, 0.3, Math.PI - 0.3); c.stroke();
    c.restore();
  }
  function drawZebra(c, x, y, r, t, tint) {
    c.save(); c.translate(x, y);
    [-1, 1].forEach(s => {
      c.fillStyle = '#f5f5f5';
      c.beginPath(); c.ellipse(s * r * 0.62, -r * 0.7, r * 0.19, r * 0.28, s * 0.35, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#2a2033';
      c.beginPath(); c.ellipse(s * r * 0.64, -r * 0.78, r * 0.1, r * 0.14, s * 0.35, 0, Math.PI * 2); c.fill();
    });
    c.fillStyle = '#f5f5f5';
    c.beginPath(); c.ellipse(0, 0, r * 0.92, r, 0, 0, Math.PI * 2); c.fill();
    c.save();
    c.beginPath(); c.ellipse(0, 0, r * 0.92, r, 0, 0, Math.PI * 2); c.clip();
    c.strokeStyle = '#1f1a26'; c.lineWidth = r * 0.13; c.lineCap = 'round';
    [-1, 1].forEach(s => {
      for (let i = 0; i < 3; i++) {
        const spread = 0.22 + i * 0.3;
        c.beginPath();
        c.moveTo(s * spread * r * 0.5, -r * 1.05);
        c.quadraticCurveTo(s * spread * r * 1.4, -r * 0.5, s * r * (0.75 + i * 0.16), -r * 0.1 + i * r * 0.2);
        c.stroke();
      }
    });
    c.fillStyle = '#1f1a26';                 // mane tuft between the ears
    c.beginPath(); c.ellipse(0, -r * 0.93, r * 0.15, r * 0.24, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    c.fillStyle = '#4a4453';
    c.beginPath(); c.ellipse(0, r * 0.54, r * 0.38, r * 0.27, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#2a2033';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.14, r * 0.5, r * 0.07, r * 0.09, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#2a2033';
    [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.38, -r * 0.16, r * 0.11, r * 0.14, 0, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = '#fff';
    [-1, 1].forEach(s => { c.beginPath(); c.arc(s * r * 0.34, -r * 0.22, r * 0.04, 0, Math.PI * 2); c.fill(); });
    c.restore();
  }

  const ANIMALS = {
    unicorn: {
      emoji: '🦄', label: 'UNICORN', ink: '#ffd6f5', draw: drawUnicorn,
      blurb: 'Unicorns paint in <b>rainbow</b>.',
      names: ['Sparkle', 'Twinkle', 'Glitter'],
      paint: (x, y, t, tint) => 'hsl(' + (((x + y) * 7 + t * 60 + tint) % 360) + ',85%,66%)',
      pop: (t) => 'hsl(' + ((t * 200) % 360) + ',90%,70%)',
    },
    pig: {
      emoji: '🐷', label: 'PIG', ink: '#ff9ec7', draw: drawPig,
      blurb: 'Pigs paint in <b>pink</b>.',
      names: ['Snorty', 'Truffle', 'Piggy'],
      paint: (x, y, t, tint) => HSL(332, 78, 68 + ((x + y) % 2) * 4, tint),
      pop: () => '#ff8fc0',
    },
    axolotl: {
      emoji: '🩷', label: 'AXOLOTL', ink: '#ffc2de', draw: drawAxolotl,
      blurb: 'Axolotls paint in <b>pink and white stripes</b>.',
      names: ['Bubbles', 'Frilly', 'Gilly'],
      paint: (x, y, t, tint) => mod(x + Math.round(Math.sin(y * 0.3) * 1.6), 6) < 3
        ? HSL(332, 92, 78, tint) : HSL(330, 60, 95, tint),
      pop: () => '#ffc2de',
    },
    capybara: {
      emoji: '🦫', label: 'CAPYBARA', ink: '#c98a5b', draw: drawCapybara,
      blurb: 'Capybaras paint in <b>dark brown with red cherries</b>.',
      names: ['Cappy', 'Nibbles', 'Biscuit'],
      paint: (x, y, t, tint) => hash2(x, y) < 0.085
        ? HSL(354, 74, 46, tint) : HSL(24, 44, 27 + ((x + y) % 2) * 2, tint),
      pop: () => '#e02a3c',
    },
    penguin: {
      emoji: '🐧', label: 'PENGUIN', ink: '#7ec8f0', draw: drawPenguin,
      blurb: 'Penguins paint in <b>light blue</b>.',
      names: ['Waddle', 'Pebble', 'Tuxedo'],
      paint: (x, y, t, tint) => HSL(198, 78, 66 + ((x + y) % 2) * 4, tint),
      pop: () => '#7ec8f0',
    },
    cat: {
      emoji: '🐱', label: 'CAT', ink: '#e08a3c', draw: drawCat,
      blurb: 'Cats paint in <b>ginger and white</b>.',
      names: ['Marmalade', 'Whiskers', 'Tiddles'],
      paint: (x, y, t, tint) => hash2(Math.floor(x / 3), Math.floor(y / 3)) < 0.4
        ? HSL(34, 62, 94, tint) : HSL(28, 78, 57, tint),
      pop: () => '#e08a3c',
    },
    tiger: {
      emoji: '🐯', label: 'TIGER', ink: '#ff8c1a', draw: drawTiger,
      blurb: 'Tigers paint in <b>orange and black</b>.',
      names: ['Stripe', 'Rajah', 'Fang'],
      paint: (x, y, t, tint) =>
        Math.abs(Math.sin(x * 0.85 + Math.sin(y * 0.4) * 1.7)) > 0.93
          ? HSL(0, 0, 12, tint) : HSL(26, 92, 55, tint),
      pop: () => '#ff8c1a',
    },
    sloth: {
      emoji: '🦥', label: 'SLOTH', ink: '#c49a6c', draw: drawSloth,
      blurb: 'Sloths paint in <b>light brown</b>.',
      names: ['Snooze', 'Mossy', 'Dozy'],
      paint: (x, y, t, tint) => HSL(30, 40, 60 + ((x + y) % 2) * 4, tint),
      pop: () => '#c49a6c',
    },
    zebra: {
      emoji: '🦓', label: 'ZEBRA', ink: '#dcd8e4', draw: drawZebra,
      blurb: 'Zebras paint in <b>black and white</b>.',
      names: ['Dazzle', 'Domino', 'Zippy'],
      paint: (x, y, t, tint) => Math.sin(x * 0.55 + Math.sin(y * 0.25) * 1.3) > 0
        ? HSL(260, 12, 13, tint) : HSL(260, 10, 94, tint),
      pop: () => '#f5f5f5',
    },
  };
  const TYPES = Object.keys(ANIMALS);
  const animalOf = (p) => ANIMALS[p.type] || ANIMALS.unicorn;

  const tileColour = (p, x, y, t) => animalOf(p).paint(x, y, t, p.tint);
  const drawAnimal = (c, p, x, y, r, t) => animalOf(p).draw(c, x, y, r, t, p.tint);

  // pick-screen previews
  const previewCtx = [];
  (function previews() {
    const wrap = $('picks');
    TYPES.forEach((type) => {
      const A = ANIMALS[type];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick' + (type === 'unicorn' ? ' on' : '');
      b.dataset.type = type;
      const cv = document.createElement('canvas');
      cv.width = 116; cv.height = 116;
      const nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = A.label; nm.style.color = A.ink;
      b.append(cv, nm);
      wrap.appendChild(b);
      previewCtx.push({ ctx: cv.getContext('2d'), draw: A.draw });
    });
    let t = 0;
    (function loop() {
      requestAnimationFrame(loop);
      t += 0.016;
      for (const p of previewCtx) {
        p.ctx.clearRect(0, 0, 116, 116);
        p.draw(p.ctx, 58, 66, 31, t, 0);
      }
    })();
  })();

  // ---------- setting up a game ----------
  function blank(p, cx, cy) {
    p.homeX = cx; p.homeY = cy;
    for (let y = cy - 2; y <= cy + 2; y++) {
      for (let x = cx - 2; x <= cx + 2; x++) {
        if (inGrid(x, y)) owner[idx(x, y)] = p.id;
      }
    }
  }
  function newGame(type) {
    owner.fill(0); trailOf.fill(0);
    players = []; pops = [];
    const spots = [];
    for (let i = 0; i < BOTS + 1; i++) {
      const a = (i / (BOTS + 1)) * Math.PI * 2;
      spots.push([Math.round(GW / 2 + Math.cos(a) * 34), Math.round(GH / 2 + Math.sin(a) * 34)]);
    }
    const takenNames = new Set();
    for (let i = 0; i <= BOTS; i++) {
      const isMe = i === 0;
      const p = {
        id: i + 1,
        isMe,
        type: isMe ? type : TYPES[Math.floor(Math.random() * TYPES.length)],
        tint: isMe ? 0 : 40 + i * 47,
        x: spots[i][0], y: spots[i][1],
        dx: 0, dy: -1, wantDx: 0, wantDy: -1,
        trail: [], alive: true, pct: 0,
        name: 'YOU',
        out: false, plan: 0, goHomeAt: 18, homeX: spots[i][0], homeY: spots[i][1],
      };
      if (!isMe) {
        const pool = ANIMALS[p.type].names;
        p.name = pool.find((n) => !takenNames.has(n)) || pool[0] + ' ' + i;
        takenNames.add(p.name);
      }
      blank(p, p.x, p.y);
      players.push(p);
    }
    me = players[0];
    camX = me.x; camY = me.y;
    recount();
    running = true;
    $('startCard').hidden = true;
    $('endCard').hidden = true;
  }

  // ---------- claiming ----------
  const seen = new Uint8Array(GW * GH);
  const stack = new Int32Array(GW * GH);
  function capture(p) {
    seen.fill(0);
    let sp = 0;
    const solid = (i) => owner[i] === p.id || trailOf[i] === p.id;
    // flood in from the edges through everything that isn't mine
    for (let x = 0; x < GW; x++) {
      for (const y of [0, GH - 1]) { const i = idx(x, y); if (!solid(i) && !seen[i]) { seen[i] = 1; stack[sp++] = i; } }
    }
    for (let y = 0; y < GH; y++) {
      for (const x of [0, GW - 1]) { const i = idx(x, y); if (!solid(i) && !seen[i]) { seen[i] = 1; stack[sp++] = i; } }
    }
    while (sp > 0) {
      const i = stack[--sp];
      const x = i % GW, y = (i / GW) | 0;
      if (x > 0) { const j = i - 1; if (!seen[j] && !solid(j)) { seen[j] = 1; stack[sp++] = j; } }
      if (x < GW - 1) { const j = i + 1; if (!seen[j] && !solid(j)) { seen[j] = 1; stack[sp++] = j; } }
      if (y > 0) { const j = i - GW; if (!seen[j] && !solid(j)) { seen[j] = 1; stack[sp++] = j; } }
      if (y < GH - 1) { const j = i + GW; if (!seen[j] && !solid(j)) { seen[j] = 1; stack[sp++] = j; } }
    }
    // anything the outside couldn't reach is now painted in
    for (let i = 0; i < owner.length; i++) if (!seen[i]) owner[i] = p.id;
    p.trail.forEach(i => { trailOf[i] = 0; });
    p.trail.length = 0;
  }

  function kill(p, why) {
    if (!p.alive) return;
    p.alive = false;
    p.trail.forEach(i => { trailOf[i] = 0; });
    p.trail.length = 0;
    for (let i = 0; i < owner.length; i++) if (owner[i] === p.id) owner[i] = 0;
    pops.push({ x: p.x, y: p.y, t: performance.now() / 1000, type: p.type, tint: p.tint });
    if (p.isMe) endGame(false, why);
    else setTimeout(() => respawn(p), 2200);
  }
  function respawn(p) {
    if (!running) return;
    for (let tries = 0; tries < 60; tries++) {
      const x = 6 + Math.floor(Math.random() * (GW - 12));
      const y = 6 + Math.floor(Math.random() * (GH - 12));
      let clear = true;
      for (let yy = y - 3; yy <= y + 3 && clear; yy++) {
        for (let xx = x - 3; xx <= x + 3; xx++) {
          if (!inGrid(xx, yy) || owner[idx(xx, yy)] || trailOf[idx(xx, yy)]) { clear = false; break; }
        }
      }
      if (!clear) continue;
      p.x = x; p.y = y; p.dx = 0; p.dy = -1; p.alive = true; p.out = false; p.legs = null;
      blank(p, x, y);
      recount();
      return;
    }
  }

  function recount() {
    const counts = new Array(players.length + 2).fill(0);
    for (let i = 0; i < owner.length; i++) counts[owner[i]]++;
    players.forEach(p => { p.pct = counts[p.id] * 100 / (GW * GH); });
  }

  // ---------- one step of movement ----------
  function stepPlayer(p) {
    if (!p.alive) return;
    if (p.isMe) {
      // no reversing straight back into your own trail
      if (!(p.wantDx === -p.dx && p.wantDy === -p.dy)) { p.dx = p.wantDx; p.dy = p.wantDy; }
    } else botThink(p);

    const nx = p.x + p.dx, ny = p.y + p.dy;
    if (!inGrid(nx, ny)) { kill(p, 'edge'); return; }
    p.x = nx; p.y = ny;
    const i = idx(nx, ny);

    // running over wet paint pops whoever owns it
    const tOwner = trailOf[i];
    if (tOwner) {
      const victim = players.find(q => q.id === tOwner);
      if (victim) { kill(victim, victim === p ? 'self' : 'crossed'); if (victim === p) return; }
    }
    if (owner[i] === p.id) {
      if (p.trail.length) { capture(p); recount(); }
      p.out = false;
    } else {
      trailOf[i] = p.id;
      p.trail.push(i);
      p.out = true;
    }
  }

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  // Pick the first direction that won't kill this bot: no reversing, no walking
  // off the field, and never onto its own wet paint.
  function safeStep(p, prefs) {
    for (const [dx, dy] of prefs) {
      if (!dx && !dy) continue;
      if (dx === -p.dx && dy === -p.dy) continue;
      const nx = p.x + dx, ny = p.y + dy;
      if (nx < 1 || ny < 1 || nx > GW - 2 || ny > GH - 2) continue;
      if (trailOf[idx(nx, ny)] === p.id) continue;
      return [dx, dy];
    }
    return null;
  }
  function botThink(p) {
    const onMine = owner[idx(p.x, p.y)] === p.id;
    // Back home with nothing to paint? Plan a rectangle: out a bit, turn once,
    // along a bit, then home — which reliably encloses a proper chunk.
    if (onMine && !p.trail.length && (!p.legs || !p.legs.length)) {
      const d = DIRS[Math.floor(Math.random() * 4)];
      const turn = Math.random() < 0.5 ? 1 : -1;
      p.legs = [
        [d[0], d[1], 7 + Math.floor(Math.random() * 10)],
        [d[1] * turn, -d[0] * turn, 6 + Math.floor(Math.random() * 9)],
      ];
    }
    let prefs;
    if (p.legs && p.legs.length) {
      const leg = p.legs[0];
      prefs = [[leg[0], leg[1]]];
      if (--leg[2] <= 0) p.legs.shift();
    } else {
      // head back to my own patch
      const ddx = Math.sign(p.homeX - p.x), ddy = Math.sign(p.homeY - p.y);
      prefs = Math.abs(p.homeX - p.x) >= Math.abs(p.homeY - p.y)
        ? [[ddx, 0], [0, ddy], [0, -ddy], [-ddx, 0]]
        : [[0, ddy], [ddx, 0], [-ddx, 0], [0, -ddy]];
    }
    const s = safeStep(p, [...prefs, ...DIRS]);
    if (s) { p.dx = s[0]; p.dy = s[1]; }
  }

  // ---------- loop ----------
  let acc = 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    if (running) {
      acc += dt;
      while (acc >= STEP) {
        acc -= STEP;
        players.forEach(stepPlayer);
        if (running && me.alive && me.pct >= WIN_PCT) endGame(true);
      }
      camX += (me.x - camX) * Math.min(1, dt * 7);
      camY += (me.y - camY) * Math.min(1, dt * 7);
    }
    render(t);
  }
  requestAnimationFrame(frame);

  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.max(10, Math.min(r.width, r.height) / VIEW);
  }
  addEventListener('resize', resize);
  resize();

  function render(t) {
    const r = stage.getBoundingClientRect();
    const w = r.width, h = r.height;
    ctx.fillStyle = '#150a2e';
    ctx.fillRect(0, 0, w, h);
    const ox = w / 2 - camX * cell, oy = h / 2 - camY * cell;

    const x0 = clamp(Math.floor(-ox / cell) - 1, 0, GW - 1);
    const x1 = clamp(Math.ceil((w - ox) / cell) + 1, 0, GW);
    const y0 = clamp(Math.floor(-oy / cell) - 1, 0, GH - 1);
    const y1 = clamp(Math.ceil((h - oy) / cell) + 1, 0, GH);

    // unpainted ground
    ctx.fillStyle = '#1d1140';
    ctx.fillRect(ox + x0 * cell, oy + y0 * cell, (x1 - x0) * cell, (y1 - y0) * cell);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = x0; x <= x1; x++) {
      ctx.beginPath(); ctx.moveTo(ox + x * cell, oy + y0 * cell); ctx.lineTo(ox + x * cell, oy + y1 * cell); ctx.stroke();
    }
    for (let y = y0; y <= y1; y++) {
      ctx.beginPath(); ctx.moveTo(ox + x0 * cell, oy + y * cell); ctx.lineTo(ox + x1 * cell, oy + y * cell); ctx.stroke();
    }

    // painted ground
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        const o = owner[idx(x, y)];
        if (!o) continue;
        const p = players[o - 1];
        if (!p) continue;
        ctx.fillStyle = tileColour(p, x, y, t);
        ctx.fillRect(ox + x * cell, oy + y * cell, cell + 0.6, cell + 0.6);
      }
    }
    // wet trails
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        const tr = trailOf[idx(x, y)];
        if (!tr) continue;
        const p = players[tr - 1];
        if (!p) continue;
        ctx.fillStyle = tileColour(p, x, y, t);
        ctx.fillRect(ox + x * cell + cell * 0.14, oy + y * cell + cell * 0.14, cell * 0.72, cell * 0.72);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(ox + x * cell + cell * 0.14, oy + y * cell + cell * 0.14, cell * 0.72, cell * 0.72);
      }
    }
    // world edge
    ctx.strokeStyle = '#ff2e88';
    ctx.lineWidth = 4;
    ctx.strokeRect(ox, oy, GW * cell, GH * cell);

    // the animals
    players.forEach(p => {
      if (!p.alive) return;
      const px = ox + (p.x + 0.5) * cell, py = oy + (p.y + 0.5) * cell;
      if (px < -60 || py < -60 || px > w + 60 || py > h + 60) return;
      drawAnimal(ctx, p, px, py, cell * 0.85, t);
      if (p.isMe) {
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(px, py, cell * 1.15, 0, Math.PI * 2); ctx.stroke();
      }
    });

    // pops
    pops = pops.filter(pp => t - pp.t < 0.6);
    pops.forEach(pp => {
      const k = (t - pp.t) / 0.6;
      const px = ox + (pp.x + 0.5) * cell, py = oy + (pp.y + 0.5) * cell;
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = (ANIMALS[pp.type] || ANIMALS.unicorn).pop(t);
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(px, py, cell * (0.6 + k * 2.4), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    // scoreboard
    if (running) {
      const sorted = players.slice().sort((a, b) => b.pct - a.pct);
      $('board').innerHTML = sorted.slice(0, 6).map(p =>
        '<div class="' + (p.isMe ? 'me' : '') + '">' + animalOf(p).emoji + ' ' +
        p.name + ' ' + p.pct.toFixed(1) + '%</div>').join('');
      $('hudPct').textContent = me.pct.toFixed(1) + '%';
    }
  }

  // ---------- controls ----------
  function setDir(dx, dy) {
    if (!running || !me.alive) return;
    if (dx === -me.dx && dy === -me.dy) return;
    me.wantDx = dx; me.wantDy = dy;
  }
  addEventListener('keydown', (e) => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { setDir(0, -1); e.preventDefault(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { setDir(0, 1); e.preventDefault(); }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { setDir(-1, 0); e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { setDir(1, 0); e.preventDefault(); }
  });
  let touchStart = null;
  stage.addEventListener('pointerdown', (e) => {
    if (!running) return;
    touchStart = { x: e.clientX, y: e.clientY };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    if (Math.hypot(dx, dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
    else setDir(0, Math.sign(dy));
    touchStart = { x: e.clientX, y: e.clientY };
  });
  const endTouch = () => { touchStart = null; };
  stage.addEventListener('pointerup', endTouch);
  stage.addEventListener('pointercancel', endTouch);

  // ---------- start / end ----------
  let chosen = 'unicorn';
  $('picks').addEventListener('click', (e) => {
    const b = e.target.closest('.pick');
    if (!b) return;
    chosen = b.dataset.type;
    [...$('picks').children].forEach((c) => c.classList.toggle('on', c === b));
    $('pickBlurb').innerHTML = ANIMALS[chosen].blurb;
  });
  $('playBtn').addEventListener('click', () => newGame(chosen));
  $('againBtn').addEventListener('click', () => newGame(chosen));
  $('changeBtn').addEventListener('click', () => { $('endCard').hidden = true; $('startCard').hidden = false; });

  function endGame(won, why) {
    running = false;
    const pct = me.pct;
    if (pct > best) {
      best = pct;
      try { localStorage.setItem('flocade-play-paint-best', String(best)); } catch {}
    }
    $('hudBest').textContent = best.toFixed(1) + '%';
    $('endTitle').textContent = won ? 'YOU WIN!' : 'POP!';
    $('endEmoji').textContent = won ? '🏆' : animalOf(me).emoji + '💥';
    const reason = why === 'self' ? 'You ran over your own wet paint!'
      : why === 'edge' ? 'You painted yourself right off the edge!'
      : 'Someone ran over your wet paint!';
    $('endBody').textContent = won
      ? 'You painted ' + pct.toFixed(1) + '% of the field. The whole place is yours!'
      : reason + ' You painted ' + pct.toFixed(1) + '%.';
    $('endCard').hidden = false;
  }

  // Test hook.
  window.__pp = {
    animals: () => TYPES,
    paintOf: (type, x, y, t) => ANIMALS[type].paint(x, y, t || 0, 0),
    start: (type) => newGame(type || 'unicorn'),
    setDir,
    step: (n = 1) => { for (let i = 0; i < n; i++) { players.forEach(stepPlayer); } recount(); },
    state: () => ({
      running,
      me: me && { type: me.type, x: me.x, y: me.y, alive: me.alive, pct: +me.pct.toFixed(2), trail: me.trail.length },
      players: players.map(p => ({ name: p.name, type: p.type, alive: p.alive, pct: +p.pct.toFixed(2) })),
      painted: players.reduce((s, p) => s + p.pct, 0).toFixed(1),
      ended: !$('endCard').hidden,
      endTitle: $('endTitle').textContent,
    }),
    forceWin: () => { for (let i = 0; i < owner.length * 0.5; i++) owner[i] = me.id; recount(); },
  };
  </script>
</body>
</html>
