<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My World — Flocade</title>
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pink: #ff7eb6;
      --pink-deep: #ff2e88;
      --cyan: #7ee8fa;
      --yellow: #ffe600;
      --text: #4a2e52;
      --cream: #fff5fb;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #cdeffd;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { position: fixed; inset: 0; display: block; }

    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    #ui > * { pointer-events: auto; }

    a.back {
      position: fixed; top: 12px; left: 12px;
      color: #fff; font-family: 'Press Start 2P', monospace; font-size: 0.65rem;
      text-decoration: none; text-shadow: 2px 2px 0 var(--pink-deep);
    }

    /* joystick */
    #joy {
      position: fixed; left: 18px; bottom: 18px;
      width: 130px; height: 130px;
      border-radius: 50%;
      background: rgba(255, 245, 251, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.7);
      touch-action: none;
    }
    #joy .thumb {
      position: absolute; left: 50%; top: 50%;
      width: 56px; height: 56px; margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255, 126, 182, 0.85);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* small round toggle buttons */
    .toggle {
      position: fixed; right: 14px;
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255, 245, 251, 0.9);
      border: 3px solid var(--pink);
      font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .toggle.off { opacity: 0.5; }
    #gyroBtn { bottom: 90px; }
    #muteBtn { bottom: 24px; }

    /* modal screens */
    .modal {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(74, 46, 82, 0.5);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--cream);
      border: 4px solid var(--pink);
      border-radius: 24px;
      padding: 1.5rem;
      max-width: 380px; width: 100%;
      text-align: center;
      box-shadow: 0 10px 0 rgba(255, 46, 136, 0.25);
    }
    .card p { color: var(--text); font-size: 1.05rem; line-height: 1.6; margin-bottom: 1rem; }
    .card .btn {
      background: var(--pink-deep); color: #fff; border: none;
      border-radius: 999px; font-weight: 700; font-size: 1rem;
      padding: 0.8rem 1.4rem; cursor: pointer; margin: 0.25rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .card .btn:active { transform: translateY(3px); box-shadow: none; }

    #intro h1 { font-family: 'Press Start 2P', monospace; color: var(--pink-deep); font-size: 1.5rem; line-height: 1.6; margin-bottom: 0.5rem; }
    .controls-help { color: var(--text); font-size: 0.9rem; line-height: 1.8; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div id="ui">
    <a class="back" href="../../">&larr; FLOCADE</a>
    <div id="joy"><div class="thumb"></div></div>
    <button class="toggle off" id="gyroBtn" title="Tilt to look">🔄</button>
    <button class="toggle" id="muteBtn" title="Music">🔊</button>
  </div>
  <div id="screen"></div>

  <script type="module">
    import * as THREE from './three.module.min.js';

    // ============================================================
    // Three.js setup
    // ============================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcdeffd);
    scene.fog = new THREE.Fog(0xcdeffd, 55, 135);

    const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 200);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xffd6ec, 1.05));
    const sun = new THREE.DirectionalLight(0xfff4e0, 0.8);
    sun.position.set(12, 25, 8);
    scene.add(sun);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const obstacles = []; // circles {x, z, r}
    const boxes = [];     // AABBs {minX, maxX, minZ, maxZ}
    const matCache = new Map();
    function mat(color, rough = 0.85, opacity = 1) {
      const key = color + '/' + rough + '/' + opacity;
      if (!matCache.has(key)) {
        matCache.set(key, new THREE.MeshStandardMaterial({
          color, roughness: rough, metalness: 0,
          transparent: opacity < 1, opacity,
        }));
      }
      return matCache.get(key);
    }

    function addBoxObstacle(cx, cz, halfX, halfZ) {
      boxes.push({ minX: cx - halfX, maxX: cx + halfX, minZ: cz - halfZ, maxZ: cz + halfZ });
    }

    // ---- Canvas sign / emoji sprite helpers ----
    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }
    const emojiTexCache = {};
    function emojiTexture(e) {
      if (emojiTexCache[e]) return emojiTexCache[e];
      const cv = document.createElement('canvas');
      cv.width = cv.height = 128;
      const c = cv.getContext('2d');
      c.font = '100px serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(e, 64, 70);
      const t = new THREE.CanvasTexture(cv);
      emojiTexCache[e] = t;
      return t;
    }
    const itemGeo = new THREE.PlaneGeometry(1, 1);
    function itemSprite(e, size = 0.6) {
      const m = new THREE.Mesh(itemGeo, new THREE.MeshBasicMaterial({ map: emojiTexture(e), transparent: true, side: THREE.DoubleSide }));
      m.scale.setScalar(size);
      return m;
    }

    // ---- Little 3D things (for shelves & scenery) ----
    // Shared unit geometries, scaled per part: [geo, color, sx,sy,sz, x,y,z, rx,ry,rz]
    const G3 = {
      box: new THREE.BoxGeometry(1, 1, 1),
      sph: new THREE.SphereGeometry(0.5, 12, 10),
      cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 12),
      cone: new THREE.ConeGeometry(0.5, 1, 12),
      tor: new THREE.TorusGeometry(0.5, 0.2, 8, 16),
      arc: new THREE.TorusGeometry(0.5, 0.22, 8, 12, Math.PI),
    };
    const HPI = Math.PI / 2, PI = Math.PI;
    const ITEM_SPECS = {
      '🍦': [['cone', 0xf0c987, .2,.34,.2, 0,.17,0, PI], ['sph', 0xffb6d9, .26,.26,.26, 0,.44,0], ['sph', 0xfff5fb, .16,.16,.16, 0,.56,0]],
      '🍨': [['cyl', 0xfff5fb, .3,.2,.3, 0,.1,0], ['sph', 0xc9f0d9, .3,.3,.3, 0,.32,0]],
      '🍧': [['cone', 0xffffff, .3,.3,.3, 0,.15,0, PI], ['sph', 0xff8ec0, .28,.26,.28, 0,.4,0]],
      '🍫': [['box', 0x8a5a3b, .34,.08,.5, 0,.04,0], ['box', 0xa8714e, .3,.05,.44, 0,.09,0]],
      '🧁': [['cyl', 0xffd6ec, .26,.2,.26, 0,.1,0], ['sph', 0xfff0b8, .3,.28,.3, 0,.32,0], ['sph', 0xff2e88, .08,.08,.08, 0,.48,0]],
      '🍪': [['cyl', 0xd9a066, .36,.09,.36, 0,.05,0], ['sph', 0x5a3a24, .07,.05,.07, .1,.1,.06], ['sph', 0x5a3a24, .07,.05,.07, -.08,.1,-.08], ['sph', 0x5a3a24, .07,.05,.07, .02,.1,-.12]],
      '🍭': [['cyl', 0xffffff, .05,.4,.05, 0,.2,0], ['sph', 0xff5ad2, .26,.26,.12, 0,.48,0]],
      '🥤': [['cyl', 0xff7eb6, .22,.4,.22, 0,.2,0], ['cyl', 0xffffff, .04,.34,.04, .07,.5,0, 0,0,.4]],
      '🧸': [['sph', 0xc98a52, .34,.32,.3, 0,.18,0], ['sph', 0xc98a52, .26,.26,.26, 0,.44,0], ['sph', 0xc98a52, .1,.1,.08, -.13,.58,0], ['sph', 0xc98a52, .1,.1,.08, .13,.58,0], ['sph', 0xf0c987, .12,.1,.1, 0,.4,.1]],
      '🤖': [['box', 0x9fb8c8, .3,.3,.24, 0,.2,0], ['box', 0xc3d6e2, .24,.2,.2, 0,.48,0], ['cyl', 0xff5a5a, .03,.14,.03, 0,.64,0], ['sph', 0xffe600, .05,.05,.05, 0,.72,0]],
      '🪀': [['cyl', 0xff5a5a, .24,.09,.24, 0,.22,0, HPI], ['cyl', 0xff8a8a, .24,.09,.24, 0,.22,.1, HPI], ['cyl', 0xffffff, .05,.24,.05, 0,.1,.05]],
      '🚂': [['box', 0x4a6cff, .5,.22,.26, 0,.2,0], ['box', 0x38406e, .2,.24,.26, -.18,.42,0], ['cyl', 0xffe600, .08,.14,.08, .16,.38,0], ['sph', 0x2b2b33, .09,.09,.05, -.16,.08,.14], ['sph', 0x2b2b33, .09,.09,.05, .16,.08,.14]],
      '🦄': [['sph', 0xffffff, .32,.28,.36, 0,.22,0], ['sph', 0xffffff, .22,.22,.22, .1,.46,.08], ['cone', 0xffe600, .07,.2,.07, .12,.62,.1, -.3], ['sph', 0xff8ec0, .1,.16,.1, .0,.5,-.02]],
      '⚽': [['sph', 0xffffff, .34,.34,.34, 0,.17,0], ['sph', 0x2b2b33, .1,.1,.06, 0,.22,.14]],
      '🎲': [['box', 0xffffff, .3,.3,.3, 0,.15,0, 0,.5,0], ['sph', 0xff2e88, .05,.05,.04, 0,.32,.06]],
      '🪁': [['box', 0xff7eb6, .3,.02,.3, 0,.3,0, 0,.8,1.1], ['cyl', 0xffe600, .02,.3,.02, .1,.08,0, 0,0,.5]],
      '🥐': [['arc', 0xe0a95e, .4,.4,.5, 0,.12,0, HPI]],
      '🍞': [['box', 0xe0b980, .3,.24,.44, 0,.12,0], ['cyl', 0xecd0a0, .15,.3,.15, 0,.24,0, 0,0,HPI]],
      '🥖': [['cyl', 0xd9a066, .12,.6,.12, 0,.2,0, HPI,0,.4]],
      '🎂': [['cyl', 0xffd6ec, .34,.16,.34, 0,.08,0], ['cyl', 0xfff5fb, .24,.14,.24, 0,.23,0], ['cyl', 0xffe600, .03,.14,.03, 0,.37,0], ['sph', 0xff9e3d, .05,.07,.05, 0,.46,0]],
      '🍩': [['tor', 0xff8ec0, .3,.3,.3, 0,.16,0, HPI]],
      '🥨': [['tor', 0xb07a3e, .26,.26,.26, 0,.14,0, HPI]],
      '👗': [['cone', 0xff7eb6, .34,.4,.34, 0,.2,0], ['sph', 0xff7eb6, .12,.12,.12, 0,.44,0]],
      '👕': [['box', 0x7ee8fa, .36,.1,.3, 0,.05,0], ['box', 0x5ecfe4, .36,.1,.3, 0,.15,0]],
      '👖': [['box', 0x4a6cff, .3,.1,.34, 0,.05,0], ['box', 0x3a56cc, .3,.1,.34, 0,.15,0]],
      '🧥': [['box', 0xff9e57, .38,.12,.32, 0,.06,0], ['box', 0xe98940, .38,.12,.32, 0,.18,0]],
      '👟': [['box', 0xffffff, .2,.14,.42, 0,.08,0], ['sph', 0xff5a5a, .11,.1,.14, 0,.1,.18], ['box', 0xffe600, .21,.05,.43, 0,.02,0]],
      '👒': [['cyl', 0xf6d365, .4,.05,.4, 0,.03,0], ['sph', 0xf6d365, .2,.16,.2, 0,.12,0], ['tor', 0xff2e88, .18,.18,.3, 0,.08,0, HPI]],
      '🧣': [['tor', 0xb38bff, .22,.22,.4, 0,.12,0, HPI], ['box', 0xb38bff, .12,.2,.04, .18,.1,0]],
      '🎒': [['box', 0x69d18c, .3,.36,.18, 0,.18,0], ['box', 0x4fb573, .2,.16,.08, 0,.14,.12], ['tor', 0x38406e, .1,.1,.2, 0,.38,0, 0,0,HPI]],
      '🍎': [['sph', 0xff5a5a, .28,.26,.28, 0,.14,0], ['cyl', 0x8a5a3b, .03,.12,.03, 0,.3,0], ['sph', 0x69d18c, .1,.05,.06, .06,.32,0]],
      '🍌': [['arc', 0xffe14d, .3,.3,.3, 0,.14,0, 0,0,PI]],
      '🥕': [['cone', 0xff9e3d, .14,.4,.14, 0,.2,0, PI], ['cone', 0x69d18c, .1,.16,.1, 0,.46,0]],
      '🥛': [['box', 0xffffff, .22,.36,.22, 0,.18,0], ['box', 0x9fd8ff, .23,.12,.23, 0,.24,0], ['box', 0xffffff, .16,.1,.16, 0,.4,0, 0,.8,0]],
      '🧃': [['box', 0xff9e57, .2,.3,.14, 0,.15,0], ['cyl', 0xffffff, .025,.2,.025, .06,.36,0, 0,0,.3]],
      '🥫': [['cyl', 0xc3d6e2, .18,.3,.18, 0,.15,0], ['cyl', 0xff5a5a, .185,.14,.185, 0,.15,0]],
      '🍉': [['sph', 0x4fb573, .3,.3,.3, 0,.16,0], ['sph', 0xff6b8a, .2,.2,.2, 0,.16,.12]],
      '🥚': [['box', 0xd9c9a8, .4,.1,.3, 0,.05,0], ['sph', 0xfffdf5, .09,.11,.09, -.1,.14,0], ['sph', 0xfffdf5, .09,.11,.09, .1,.14,0], ['sph', 0xfffdf5, .09,.11,.09, 0,.14,.09]],
      '📕': [['box', 0xff5a5a, .1,.42,.3, 0,.21,0], ['box', 0xffffff, .06,.38,.27, .02,.21,0]],
      '📗': [['box', 0x69d18c, .1,.42,.3, 0,.21,0, 0,0,.12], ['box', 0xffffff, .06,.38,.27, .02,.21,0, 0,0,.12]],
      '📘': [['box', 0x4a6cff, .1,.42,.3, 0,.21,0], ['box', 0xffffff, .06,.38,.27, .02,.21,0]],
      '📙': [['box', 0xff9e3d, .34,.09,.26, 0,.05,0], ['box', 0xffe14d, .3,.09,.24, .02,.14,0, 0,.2,0], ['box', 0xb38bff, .26,.09,.22, 0,.23,0, 0,-.15,0]],
      '🧩': [['box', 0x7ee8fa, .32,.08,.32, 0,.04,0], ['sph', 0x7ee8fa, .09,.08,.09, .16,.04,0], ['sph', 0xff7eb6, .09,.08,.09, -.05,.1,.05]],
      '🎮': [['box', 0x38406e, .36,.1,.2, 0,.06,0], ['sph', 0xff5a5a, .05,.05,.05, .1,.12,.03], ['sph', 0xffe600, .05,.05,.05, .14,.12,-.03], ['cyl', 0x9fb8c8, .05,.04,.05, -.1,.12,0]],
      '✏️': [['cyl', 0xffe14d, .06,.4,.06, 0,.2,0, 0,0,.5], ['cone', 0xf0c987, .06,.12,.06, .12,.42,0, 0,0,.5], ['cyl', 0xff8ec0, .062,.06,.062, -.1,.02,0, 0,0,.5]],
      '🎨': [['cyl', 0xd9a066, .34,.06,.28, 0,.04,0], ['sph', 0xff5a5a, .06,.04,.06, .1,.08,.06], ['sph', 0x4a6cff, .06,.04,.06, -.08,.08,.08], ['sph', 0xffe600, .06,.04,.06, 0,.08,-.1], ['sph', 0x69d18c, .06,.04,.06, .12,.08,-.06]],
    };
    function item3D(emoji, size = 1) {
      const spec = ITEM_SPECS[emoji];
      if (!spec) return itemSprite(emoji, 0.55); // graceful fallback
      const g = new THREE.Group();
      for (const [geo, color, sx, sy, sz, x, y, z, rx = 0, ry = 0, rz = 0] of spec) {
        const m = new THREE.Mesh(G3[geo], mat(color, 0.7));
        m.scale.set(sx, sy, sz);
        m.position.set(x, y, z);
        m.rotation.set(rx, ry, rz);
        g.add(m);
      }
      g.scale.setScalar(size);
      return g;
    }
    function textSign(emoji, label, w = 2.4, h = 2.4) {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const c = cv.getContext('2d');
      c.fillStyle = '#fff5fb';
      c.strokeStyle = '#ff7eb6'; c.lineWidth = 14;
      roundRect(c, 12, 12, 232, 232, 36); c.fill(); c.stroke();
      c.font = '110px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(emoji, 128, 105);
      c.fillStyle = '#ff2e88'; c.font = 'bold 42px Inter, sans-serif';
      c.fillText(label, 128, 202);
      const tex = new THREE.CanvasTexture(cv);
      return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    }

    // ---- Ground ----
    const ground = new THREE.Mesh(new THREE.CircleGeometry(95, 56), mat(0xb6e8a0));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // soft path from park to mall
    const path = new THREE.Mesh(new THREE.PlaneGeometry(5, 70), mat(0xf3e2c7));
    path.rotation.x = -Math.PI / 2;
    path.position.y = 0.02;
    scene.add(path);
    // east to the zoo, west to the beach, north through the park to the street
    function walkway(cx, cz, w, l, ry = 0) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(w, l), mat(0xf3e2c7));
      p.rotation.x = -Math.PI / 2;
      p.rotation.z = ry;
      p.position.set(cx, 0.02, cz);
      scene.add(p);
    }
    walkway(21, 0, 32, 4.2);   // plaza → zoo gate
    walkway(-22, 0, 34, 4.2);  // plaza → beach
    walkway(0, -42, 4.2, 26);  // park → street of houses

    // plaza disc
    const plaza = new THREE.Mesh(new THREE.CircleGeometry(7, 40), mat(0xffe3f1));
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.y = 0.03;
    scene.add(plaza);

    // ---- Fountain (centre) ----
    (function fountain() {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.3, 0.6, 24), mat(0xffd6ec));
      base.position.y = 0.3;
      const water = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.62, 24), mat(0x9fe0ff, 0.4));
      water.position.y = 0.34;
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 1.2, 16), mat(0xffffff));
      stem.position.y = 1.1;
      const top = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), mat(0x9fe0ff, 0.4));
      top.position.y = 1.9;
      g.add(base, water, stem, top);
      scene.add(g);
      obstacles.push({ x: 0, z: 0, r: 2.4 });
    })();

    // ---- Trees & flowers (park, -z) ----
    function tree(x, z, scale = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.6, 10), mat(0xb98b5e));
      trunk.position.y = 0.8;
      const leafColor = [0x8fd96b, 0xa7e88a, 0x7fd0a0][Math.floor(Math.random() * 3)];
      for (let i = 0; i < 3; i++) {
        const blob = new THREE.Mesh(new THREE.SphereGeometry(1 - i * 0.18, 14, 12), mat(leafColor));
        blob.position.set((Math.random() - 0.5) * 0.5, 1.8 + i * 0.55, (Math.random() - 0.5) * 0.5);
        g.add(blob);
      }
      g.add(trunk);
      g.position.set(x, 0, z);
      g.scale.setScalar(scale);
      scene.add(g);
      obstacles.push({ x, z, r: 0.6 * scale });
    }
    function flower(x, z) {
      const g = new THREE.Group();
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6), mat(0x6cc24a));
      stem.position.y = 0.25;
      const petalColor = [0xff7eb6, 0xffe600, 0xffffff, 0xb38bff, 0xff9e57][Math.floor(Math.random() * 5)];
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), mat(petalColor));
      head.position.y = 0.55;
      const centre = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), mat(0xffe600));
      centre.position.y = 0.62;
      g.add(stem, head, centre);
      g.position.set(x, 0, z);
      scene.add(g);
    }
    const treePositions = [[-12,-10],[-18,-16],[-22,-24],[-8,-22],[-14,-30],[24,-30],[8,-30],[-25,-8],[24,-8],[-20,-32]];
    treePositions.forEach(([x, z], i) => tree(x, z, 0.8 + (i % 3) * 0.15));
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2, d = 6 + Math.random() * 26;
      const x = Math.sin(a) * d, z = -8 - Math.random() * 24;
      const inPlaypark = x > 5.5 && x < 21 && z > -28 && z < -12;
      if (Math.abs(x) > 3.2 && !inPlaypark) flower(x, z);
    }

    // ============================================================
    // Kids' play park (east side of the park)
    // ============================================================
    const rides = []; // {group|mesh, kind, phase}
    (function playPark() {
      const matSoft = mat(0xffd9a0);
      const rubber = new THREE.Mesh(new THREE.CircleGeometry(8.5, 36), matSoft);
      rubber.rotation.x = -Math.PI / 2;
      rubber.position.set(13, 0.04, -20);
      scene.add(rubber);

      const post = (x, z, h, color = 0xff7eb6, r = 0.09) => {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 10), mat(color));
        m.position.set(x, h / 2, z);
        scene.add(m);
        return m;
      };

      // --- Slide ---
      (function slide() {
        const x = 16.5, z = -16.5;

    // A shelf unit: back panel + 3 boards, each stocked with items. Faces +z before rotation.
    function shelfUnit(items, offset) {
      const g = new THREE.Group();
      const back = new THREE.Mesh(new THREE.BoxGeometry(4.4, 3.1, 0.14), mat(0xffe0f0));
      back.position.y = 1.55;
      g.add(back);

        const board = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.09, 0.7), mat(0xffffff));
        board.position.set(0, y, 0.38);
        g.add(board);
        for (let i = 0; i < 4; i++) {
          const it = item3D(items[(row * 4 + i + offset) % items.length]);
          it.position.set(-1.5 + i, y + 0.05, 0.38);
          it.rotation.y = (Math.random() - 0.5) * 0.9;
          g.add(it);
        }
      });
      return g;
    }

    function placeShelf(x, z, ry, items, offset) {
      const u = shelfUnit(items, offset);
      u.position.set(x, 0, z);
      u.rotation.y = ry;

      // AABB: 4.4 long, ~1 deep, oriented by ry
      const along = Math.abs(Math.sin(ry)) > 0.5; // true → long axis runs along z
      addBoxObstacle(x, z, along ? 0.6 : 2.2, along ? 2.2 : 0.6);

      wallBox(x + W2, z, 0.4, D2 * 2, H, wallColor);

      furnish(x, z, fz);

    function blob(g, geoKey, color, sx, sy, sz, x, y, z, rx = 0, ry = 0, rz = 0, rough = 0.8) {
      const m = new THREE.Mesh(G3[geoKey], mat(color, rough));
      m.scale.set(sx, sy, sz);
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, rz);
      g.add(m);
      return m;
    }
    function kawaiiEyes(g, y, zOff, spread = 0.16, size = 0.055) {
      for (const sx of [-spread, spread]) {
        blob(g, 'sph', 0x2b2b33, size, size * 1.2, size * 0.5, sx, y, zOff, 0, 0, 0, 0.4);
        blob(g, 'sph', 0xffffff, size * 0.35, size * 0.35, size * 0.3, sx + 0.03, y + 0.04, zOff + 0.03, 0, 0, 0, 0.3);
      }
    }
    function fourLegs(g, color, w, y, dz, r = 0.09) {
      for (const [sx, sz] of [[-w, dz], [w, dz], [-w, -dz], [w, -dz]]) {
        blob(g, 'cyl', color, r * 2, y * 2, r * 2, sx, y, sz);
      }
    }

        if (d < min && d > 0.0001) {
          nx = o.x + (dx / d) * min;
          nz = o.z + (dz / d) * min;
        }
      }
      for (const b of boxes) {
        const cx = Math.max(b.minX, Math.min(nx, b.maxX));
        const cz = Math.max(b.minZ, Math.min(nz, b.maxZ));
        let dx = nx - cx, dz = nz - cz;
        const d2 = dx * dx + dz * dz;
        if (d2 < RADIUS * RADIUS) {
          if (d2 > 1e-8) {
            const d = Math.sqrt(d2);
            nx = cx + (dx / d) * RADIUS;
            nz = cz + (dz / d) * RADIUS;
          } else {
            // centre is inside the box — push out through the nearest face
            const pushes = [
              { d: nx - b.minX, x: b.minX - RADIUS, z: nz },
              { d: b.maxX - nx, x: b.maxX + RADIUS, z: nz },
              { d: nz - b.minZ, x: nx, z: b.minZ - RADIUS },
              { d: b.maxZ - nz, x: nx, z: b.maxZ + RADIUS },
            ].sort((a, b2) => a.d - b2.d);
            nx = pushes[0].x; nz = pushes[0].z;
          }
        }
      }
      const dc = Math.hypot(nx, nz);
      if (dc > WORLD_R) { nx = (nx / dc) * WORLD_R; nz = (nz / dc) * WORLD_R; }
      return [nx, nz];
    }

    // ---- Joystick ----
    const joy = document.getElementById('joy');
    const thumb = joy.querySelector('.thumb');
    let joyId = null;
    function setJoy(cx, cy) {
      const r = joy.getBoundingClientRect();
      let dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
      const max = r.width / 2, d = Math.hypot(dx, dy);
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      thumb.style.transform = `translate(${dx}px, ${dy}px)`;
      move.s = dx / max;
      move.f = -dy / max;
    }
    joy.addEventListener('pointerdown', e => { joyId = e.pointerId; setJoy(e.clientX, e.clientY); joy.setPointerCapture(e.pointerId); });
    joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) setJoy(e.clientX, e.clientY); });
    function endJoy(e) { if (e.pointerId === joyId) { joyId = null; thumb.style.transform = ''; move.f = move.s = 0; } }
    joy.addEventListener('pointerup', endJoy);
    joy.addEventListener('pointercancel', endJoy);

    // ---- Look (drag anywhere else) ----
    let lookId = null, lastLook = null;
    renderer.domElement.addEventListener('pointerdown', e => { lookId = e.pointerId; lastLook = { x: e.clientX, y: e.clientY }; });
    addEventListener('pointermove', e => {
      if (e.pointerId !== lookId || gyroOn) return;
      player.yaw -= (e.clientX - lastLook.x) * 0.005;
      player.pitch -= (e.clientY - lastLook.y) * 0.005;
      player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
      lastLook = { x: e.clientX, y: e.clientY };
    });
    addEventListener('pointerup', e => { if (e.pointerId === lookId) lookId = null; });

    // ---- Keyboard (desktop) ----
    const keys = {};
    addEventListener('keydown', e => { keys[e.code] = true; });
    addEventListener('keyup', e => { keys[e.code] = false; });
    function readKeys() {
      let f = 0, s = 0;
      if (keys.KeyW || keys.ArrowUp) f += 1;
      if (keys.KeyS || keys.ArrowDown) f -= 1;
      if (keys.KeyD || keys.ArrowRight) s += 1;
      if (keys.KeyA || keys.ArrowLeft) s -= 1;
      if (f || s) { move.f = f; move.s = s; }
    }

    // ---- Gyro look (optional) ----
    let gyroOn = false, gyroBase = null;
    const gyroBtn = document.getElementById('gyroBtn');
    gyroBtn.addEventListener('click', async () => {
      if (!gyroOn) {
        if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
          try { const p = await DeviceOrientationEvent.requestPermission(); if (p !== 'granted') return; } catch (e) { return; }
        }
        gyroOn = true; gyroBase = null; gyroBtn.classList.remove('off');
      } else {
        gyroOn = false; gyroBtn.classList.add('off');
      }
    });
    addEventListener('deviceorientation', e => {
      if (!gyroOn || e.alpha === null) return;
      if (!gyroBase) gyroBase = e.alpha;
      let d = ((e.alpha - gyroBase + 540) % 360) - 180;
      player.yaw = -d * Math.PI / 180;
      player.pitch = Math.max(-1.2, Math.min(1.2, ((e.beta ?? 90) - 90) * Math.PI / 180));
    });

    // ============================================================
    // Sound (WebAudio)
    // ============================================================
    let actx = null, ambientGain = null, muted = false;
    function initAudio() {
      if (actx) return;
      actx = new (window.AudioContext || window.webkitAudioContext)();
      // gentle ambient pad
      ambientGain = actx.createGain();
      ambientGain.gain.value = 0.04;
      ambientGain.connect(actx.destination);
      [220, 277.18, 329.63].forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const lfo = actx.createOscillator(), lg = actx.createGain();
        lfo.frequency.value = 0.07 + i * 0.03; lg.gain.value = 0.5;
        lfo.connect(lg).connect(g.gain);
        g.gain.value = 0.5;
        o.connect(g).connect(ambientGain);
        o.start(); lfo.start();
      });
    }
    function splash() {
      if (!actx || muted) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(500, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(120, actx.currentTime + 0.25);
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.3);
      o.connect(g).connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + 0.3);
    }
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      muted = !muted;
      if (ambientGain) ambientGain.gain.value = muted ? 0 : 0.04;
      muteBtn.textContent = muted ? '🔇' : '🔊';
      muteBtn.classList.toggle('off', muted);
    });

    // ============================================================
    // Main loop
    // ============================================================
    const clock = new THREE.Clock();
    let started = false;
    let wasInWater = false;
    const screenDiv = document.getElementById('screen');

    // State peek for automated testing.
    window.__mw = {
      player,
      start: () => { started = true; screenDiv.innerHTML = ''; },
      counts: () => ({ obstacles: obstacles.length, boxes: boxes.length, rides: rides.length, people: people.length }),
    };

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      const t = clock.elapsedTime;

      if (started) {
        readKeys();
        const SPEED = 5.5;
        if (move.f || move.s) {
          const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
          const rgtX = Math.cos(player.yaw), rgtZ = -Math.sin(player.yaw);
          let vx = fwdX * move.f + rgtX * move.s;
          let vz = fwdZ * move.f + rgtZ * move.s;
          const vm = Math.hypot(vx, vz) || 1;
          const nx = player.x + (vx / vm) * SPEED * dt;
          const nz = player.z + (vz / vm) * SPEED * dt;
          [player.x, player.z] = resolveCollisions(nx, nz);
        }
        if (!keys.KeyW && !keys.KeyS && !keys.KeyA && !keys.KeyD && joyId === null &&
            !keys.ArrowUp && !keys.ArrowDown && !keys.ArrowLeft && !keys.ArrowRight) { move.f = move.s = 0; }
      }

      // paddling in the sea: camera bobs and you hear a splash going in
      const inWater = player.x < -70.5;
      if (inWater && !wasInWater) splash();
      wasInWater = inWater;
      const waterDip = inWater ? -0.35 + Math.sin(t * 2.2) * 0.06 : 0;
      camera.position.set(player.x, EYE + waterDip, player.z);
      camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

      // playground rides, zoo animals, tides
      for (const r of rides) {
        if (r.baseY === undefined) { r.baseY = r.group.position.y; r.baseRotY = r.group.rotation.y; }
        if (r.kind === 'swing') r.group.rotation.x = Math.sin(t * 1.7 + r.phase) * 0.5;
        else if (r.kind === 'seesaw') r.group.rotation.z = Math.sin(t * 1.4) * 0.22;
        else if (r.kind === 'spin') r.group.rotation.y += dt * 0.9;
        else if (r.kind === 'boing') r.group.position.y = r.baseY + Math.abs(Math.sin(t * 2.6 + r.phase)) * 0.18;
        else if (r.kind === 'sway') r.group.rotation.y = r.baseRotY + Math.sin(t * 1.1 + r.phase) * 0.16;
        else if (r.kind === 'waddle') r.group.rotation.z = Math.sin(t * 2.4 + r.phase) * 0.14;
        else if (r.kind === 'wave') r.group.position.x = r.baseX + Math.sin(t * 0.55 + r.phase) * 1.4;
        else if (r.kind === 'floaty') {
          r.group.position.y = 0.18 + Math.sin(t * 1.3 + r.phase) * 0.05;
          r.group.rotation.x = -Math.PI / 2 + Math.sin(t * 0.9) * 0.07;
        }
      }

      // people animation
      for (const m of people) {
        m.group.position.y = Math.abs(Math.sin(t * 2 + m.phase)) * 0.05;
        if (m.data.region && started) {
          m.wt -= dt;
          if (m.wt <= 0) {
            pickTarget(m);
            m.wt = 2.5 + Math.random() * 4;
          }
          const dx = m.tx - m.group.position.x, dz = m.tz - m.group.position.z;
          const d = Math.hypot(dx, dz);
          if (d > 0.1) {
            m.group.position.x += (dx / d) * 1.1 * dt;
            m.group.position.z += (dz / d) * 1.1 * dt;
            m.faceYaw = Math.atan2(dx, dz);
          }
          m.group.rotation.y += (((m.faceYaw - m.group.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * Math.min(1, dt * 6);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // Intro screen
    // ============================================================
    function showIntro() {
      screenDiv.innerHTML = `<div class="modal"><div class="card" id="intro">
        <h1>MY WORLD</h1>
        <div style="font-size:2.5rem">🌸🏬🦁🏖️</div>
        <p>Explore the park and play park, browse the mall, visit the library, peek inside people's houses, paddle at the beach — and go right inside the zoo cages with the lions, tigers and monkeys!</p>
        <div class="controls-help">🕹️ Drag the circle to walk<br>👆 Swipe the screen to look around<br>⌨️ Or use WASD / arrow keys</div>
        <button class="btn" data-act="go">LET'S GO!</button>
      </div></div>`;
      screenDiv.querySelector('[data-act=go]').addEventListener('click', () => {
        screenDiv.innerHTML = '';
        started = true;
        initAudio();
        if (actx && actx.state === 'suspended') actx.resume();
      });
    }

    showIntro();
  </script>
</body>
</html>
