    t: -1.2, melody: [], songEnd: 0, myPitch: 4.5, singing: false,
    inTune: 0, noteTime: 0, tol: 0.8, voice: null, sparkles: [], over: false, wob: 0,
  };

  (function build() {
    // a simple up-and-down tune, each note 1.1s
    const line = [0, 2, 4, 2, 0, 4, 5, 4, 2, 4, 7, 5, 4, 2, 0, 2, 4, 5, 7, 5, 4, 2, 0, 0];
    let t = 1.2;
    for (const n of line) {
      const dur = 1.05;
      st.melody.push({ n, t, dur });
      t += dur;
    }
    st.songEnd = t + 0.8;
  })();

  // The staff is capped in height so the notes stay chunky bars, not towers.
  function staff() {
    const avail = H - (SAFE_T + 30) - 70;
    const h = Math.min(avail, 460);
    const top = SAFE_T + 30 + (avail - h) / 2;
    return { top, bot: top + h };
  }
  function y2pitch(y) {
    const { top, bot } = staff();
    return clamp((bot - y) / (bot - top), 0, 1) * (SCALE.length - 1);
  }
  function pitch2y(p) {
    const { top, bot } = staff();
    return bot - (p / (SCALE.length - 1)) * (bot - top);
  }
  function freqOf(p) {
    const i = clamp(p, 0, SCALE.length - 1);
    const lo = Math.floor(i), hi = Math.min(SCALE.length - 1, lo + 1);
    return SCALE[lo] + (SCALE[hi] - SCALE[lo]) * (i - lo);
  }

  function startVoice() {
    if (muted) return;
    const a = ac(); if (!a) return;
    stopVoice();
    const o = a.createOscillator(), gn = a.createGain();
    o.type = 'sine'; o.frequency.value = freqOf(st.myPitch);
    gn.gain.value = 0.0001;
    gn.gain.linearRampToValueAtTime(0.12, a.currentTime + 0.06);
    const lfo = a.createOscillator(), lg = a.createGain();
    lfo.frequency.value = 5.2; lg.gain.value = 4;
    lfo.connect(lg); lg.connect(o.frequency);
    o.connect(gn); gn.connect(a.destination);
    o.start(); lfo.start();
    st.voice = { o, gn, lfo, a };
  }
  function stopVoice() {
    if (!st.voice) return;
    const { o, gn, lfo, a } = st.voice;
    try {
      gn.gain.cancelScheduledValues(a.currentTime);
      gn.gain.setValueAtTime(gn.gain.value, a.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.08);
      o.stop(a.currentTime + 0.12); lfo.stop(a.currentTime + 0.12);
    } catch (e) { /* already stopped */ }
    st.voice = null;
  }

  function currentNote() {
    for (const m of st.melody) if (st.t >= m.t && st.t < m.t + m.dur) return m;
    return null;
  }

  return {
    layout() {},
    stop: stopVoice,
    down(x, y) { st.singing = true; st.myPitch = y2pitch(y); startVoice(); },
    move(x, y, id, pressed) { if (st.singing && pressed) st.myPitch = y2pitch(y); },
    up() { st.singing = false; stopVoice(); },
    key(code, down) {
      const step = 0.7;
      if (code === 'ArrowUp') { if (down) { st.myPitch = clamp(st.myPitch + step, 0, SCALE.length - 1); st.singing = true; startVoice(); } }
      if (code === 'ArrowDown') { if (down) { st.myPitch = clamp(st.myPitch - step, 0, SCALE.length - 1); st.singing = true; startVoice(); } }
      if (code === 'Space') {
        if (down) { st.singing = true; startVoice(); }
        else { st.singing = false; stopVoice(); }
      }
    },
    update(dt) {
      if (st.over) return;
      st.t += dt; st.wob += dt;
      if (st.voice) st.voice.o.frequency.setTargetAtTime(freqOf(st.myPitch), st.voice.a.currentTime, 0.03);
      const m = currentNote();
      if (m && st.t > 0) {
        st.noteTime += dt;
        const off = Math.abs(st.myPitch - m.n);
        if (st.singing && off <= st.tol) {
          st.inTune += dt;
          if (Math.random() < dt * 22) st.sparkles.push({ x: W * 0.34, y: pitch2y(st.myPitch), vx: 90 + Math.random() * 60, vy: (Math.random() - 0.5) * 60, life: 0.7 });
        }
      }
      for (const s of st.sparkles) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
      st.sparkles = st.sparkles.filter((s) => s.life > 0);
      if (st.t >= st.songEnd) {
        st.over = true; stopVoice();
        const acc = st.noteTime ? st.inTune / st.noteTime : 0;
        if (acc >= PASS) succeed('singer');
        else failJob('You were in tune ' + Math.round(acc * 100) + '% of the time. The choir wants ' + Math.round(PASS * 100) + '%.');
      }
    },
    draw(dt) {
      backdrop('#2a0b3f', '#0d0221');
      // stage lights
      for (let i = 0; i < 3; i++) {
        const lx = W * (0.2 + i * 0.3);
        const grd = g.createLinearGradient(lx, 0, lx, H);
        const a = 0.05 + Math.sin(st.wob * 2 + i) * 0.03;
        grd.addColorStop(0, 'rgba(255,46,136,' + Math.max(0, a) + ')');
        grd.addColorStop(1, 'rgba(255,46,136,0)');
        g.fillStyle = grd; g.beginPath();
        g.moveTo(lx, 0); g.lineTo(lx - W * 0.18, H); g.lineTo(lx + W * 0.18, H); g.closePath(); g.fill();
      }

      const nowX = W * 0.3;
      const pxPerSec = Math.max(W * 0.42, 130);
      const { top: stTop, bot: stBot } = staff();
      // staff lines
      for (let i = 0; i < SCALE.length; i++) {
        const y = pitch2y(i);
        g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      }
      // melody blocks
      for (const m of st.melody) {
        const x = nowX + (m.t - st.t) * pxPerSec;
        const w = m.dur * pxPerSec - 4;
        if (x + w < -20 || x > W + 20) continue;
        const y = pitch2y(m.n), h = Math.max(10, (pitch2y(0) - pitch2y(1)) * 1.1);
        const active = st.t >= m.t && st.t < m.t + m.dur;
        fillRR(x, y - h / 2, w, h, h / 2, active ? 'rgba(255,230,0,0.35)' : 'rgba(0,240,255,0.22)');
        strokeRR(x, y - h / 2, w, h, h / 2, active ? '#ffe600' : 'rgba(0,240,255,0.5)', 2);
      }
      // the "now" line
      g.strokeStyle = '#ff2e88'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(nowX, stTop - 14); g.lineTo(nowX, stBot + 14); g.stroke();

      // sparkles
      for (const s of st.sparkles) {
        g.fillStyle = 'rgba(255,230,0,' + clamp(s.life / 0.7, 0, 1) + ')';
        g.beginPath(); g.arc(s.x, s.y, 3, 0, 7); g.fill();
      }

      // you, with a mic
      const my = pitch2y(st.myPitch);
      const m = currentNote();
      const good = st.singing && m && Math.abs(st.myPitch - m.n) <= st.tol;
      g.fillStyle = good ? 'rgba(124,255,90,0.25)' : 'rgba(255,255,255,0.1)';
      g.beginPath(); g.arc(nowX, my, 26, 0, 7); g.fill();
      emoji(st.singing ? (good ? '😃' : '😐') : '😶', nowX, my, 34);
      emoji('🎤', nowX - 30, my + 14, 22);
      if (!st.singing && st.t > 1.0) {
        txt('↕ HOLD & DRAG TO SING', W / 2, stBot + 34, { size: fitSize('↕ HOLD & DRAG TO SING', W - 40, 11), col: '#ffe600' });
      }

      headerBar('SINGER', '🎶 ' + Math.round((st.noteTime ? st.inTune / st.noteTime : 0) * 100) + '%');
      const mw = Math.min(W - 40, 300);
      const acc = st.noteTime ? st.inTune / st.noteTime : 0;
      meter((W - mw) / 2, SAFE_T - 6, mw, 14, clamp(st.t / st.songEnd, 0, 1),
        { col: acc >= PASS ? '#7cff5a' : '#ff2e88', label: 'IN TUNE ' + Math.round(acc * 100) + '% / ' + Math.round(PASS * 100) + '%' });
      if (st.t < 0.9) {
        const rw = Math.min(W - 40, 300);
        fillRR((W - rw) / 2, stTop - 46, rw, 30, 8, 'rgba(13,2,33,0.85)');
        txt('HOLD & DRAG TO SING', W / 2, stTop - 31, { size: fitSize('HOLD & DRAG TO SING', rw - 16, 12), col: '#00f0ff' });
      }
    },
  };
}

/* ======================================================================== *
 *  JOB 10 — DANCER
 *  Copy the lead dancer's move before the next beat. The music speeds up.
 * ======================================================================== */
function makeDancer() {
  const MOVES = [
    { nm: 'ARMS UP', ic: '🙌', lead: '🙌' },
    { nm: 'SPIN', ic: '🌀', lead: '🕺' },
    { nm: 'FLIP', ic: '🤸', lead: '🤸' },
    { nm: 'WIGGLE', ic: '〰️', lead: '💃' },
  ];
  const TARGET = 18, MAX_MISS = 4;
  const st = {
    got: 0, missed: 0, beat: 1.45, timer: 0, move: -1, answered: false,
    buttons: [], flashBtn: -1, flashT: 0, ok: null, okT: 0, floor: 0, over: false, combo: 0,
  };

  function layout() {
    const bh = clamp(H * 0.14, 62, 100);
    const gap = 8, side = 10;
    const cols = W > H * 0.9 ? 4 : 2;
    const rows = 4 / cols;
    const bw = (W - side * 2 - gap * (cols - 1)) / cols;
    st.buttons = MOVES.map((m, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      return {
        x: side + c * (bw + gap), y: H - (rows - r) * (bh + gap) - 8,
        w: bw, h: bh, icon: m.ic, label: m.nm, i,
      };
    });
  }
  layout();

  function nextMove() {
    st.move = Math.floor(Math.random() * MOVES.length);
    st.answered = false;
    st.timer = st.beat;
    tone(110, 0.12, { type: 'sine', vol: 0.14, to: 60 });
    noise(0.03, { vol: 0.04, hp: 4000 });
  }
  nextMove();

  function copy(i) {
    if (st.over || st.answered) return;
    st.flashBtn = i; st.flashT = 0.18;
    st.answered = true;
    if (i === st.move) {
      st.got++; st.combo++;
      st.ok = true; st.okT = 0.5;
      tone(700 + Math.min(st.combo, 8) * 60, 0.1, { type: 'triangle', vol: 0.12 });
      st.beat = Math.max(0.78, st.beat - 0.035);
      if (st.got >= TARGET) { st.over = true; succeed('dancer'); return; }
    } else {
      st.missed++; st.combo = 0;
      st.ok = false; st.okT = 0.5;
      SFX.bad();
      if (st.missed >= MAX_MISS) { st.over = true; failJob('You lost the routine. Watch the lead dancer and copy the move!'); }
    }
  }

  return {
    layout,
    down(x, y) {
      const b = st.buttons.find((b2) => inRect(b2, x, y));
      if (b) copy(b.i);
    },
    key(code, down) {
      if (!down) return;
      const n = { ArrowUp: 0, ArrowRight: 1, ArrowLeft: 2, ArrowDown: 3, Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[code];
      if (n !== undefined) copy(n);
    },
    update(dt) {
      if (st.over) return;
      st.floor += dt;
      st.flashT = Math.max(0, st.flashT - dt);
      st.okT = Math.max(0, st.okT - dt);
      st.timer -= dt;
      if (st.timer <= 0) {
        if (!st.answered) {
          st.missed++; st.combo = 0; st.ok = false; st.okT = 0.5; SFX.bad(); flashScreen('#ff2e88');
          if (st.missed >= MAX_MISS) { st.over = true; failJob('Too many missed moves. Keep up with the beat!'); return; }
        }
        nextMove();
      }
    },
    draw(dt) {
      backdrop('#160736', '#0d0221');
      // disco floor — fills everything between the dancer and the buttons
      const btnTop = st.buttons[0] ? st.buttons[0].y : H - 100;
      const topY = btnTop - clamp(H * 0.2, 80, 170);
      const cell = clamp(W / 8, 40, 80);
      const rows = 4, rowH = (btnTop - 10 - topY) / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < Math.ceil(W / cell) + 1; c++) {
          const ph = Math.sin(st.floor * 4 + r * 0.8 + c * 0.6);
          const col = ['rgba(255,46,136,', 'rgba(0,240,255,', 'rgba(255,230,0,'][(r + c) % 3];
          g.fillStyle = col + (0.06 + Math.max(0, ph) * 0.16) + ')';
          g.fillRect(c * cell, topY + r * rowH, cell - 2, rowH - 2);
        }
      }
      // disco ball
      emoji('🪩', W / 2, SAFE_T + clamp(H * 0.06, 26, 50), clamp(W * 0.11, 30, 52));

      // lead dancer shows the move, centred between the disco ball and the floor
      const lead = MOVES[st.move];
      const cy = Math.max(SAFE_T + 90, (SAFE_T + 70 + topY) / 2);
      const bob = Math.abs(Math.sin(st.floor * 6)) * 8;
      const leadSize = clamp(Math.min(W, H) * 0.24, 70, 130);
      emoji(lead.lead, W / 2, cy - bob, leadSize);
      txt('COPY THIS!', W / 2, cy - leadSize * 0.72 - 14, { size: Math.min(W / 22, 13), col: '#ffe600' });
      txt(lead.nm, W / 2, cy + leadSize * 0.66 + 14, { size: Math.min(W / 18, 16), col: '#00f0ff' });

      // beat timer
      const tw = Math.min(W - 60, 240);
      const meterY = cy + leadSize * 0.66 + 34;
      meter((W - tw) / 2, meterY, tw, 9, clamp(st.timer / st.beat, 0, 1),
        { col: st.timer / st.beat < 0.35 ? '#ff2e88' : '#7cff5a' });

      if (st.okT > 0) {
        const msg = st.ok ? (st.combo > 3 ? 'ON FIRE! x' + st.combo : 'NICE!') : 'MISSED!';
        const my = (meterY + 20 + topY) / 2;
        const size = fitSize(msg, W - 60, 18);
        g.globalAlpha = clamp(st.okT / 0.5, 0, 1);
        g.font = `${size}px ${PIX}`;
        const pw = g.measureText(msg).width + 22;
        fillRR((W - pw) / 2, my - size, pw, size * 2, 8, 'rgba(13,2,33,0.85)');
        txt(msg, W / 2, my, { size, col: st.ok ? '#7cff5a' : '#ff2e88' });
        g.globalAlpha = 1;
      }

      for (const b of st.buttons) {
        const lit = st.flashBtn === b.i && st.flashT > 0;
        drawButton(b, {
          col: lit ? (st.ok ? '#7cff5a' : '#ff2e88') : '#00f0ff',
          bg: lit ? (st.ok ? 'rgba(124,255,90,0.25)' : 'rgba(255,46,136,0.25)') : 'rgba(0,240,255,0.1)',
          pressed: lit,
        });
      }

      headerBar('DANCER', '💃 ' + st.got + '/' + TARGET);
      let x = '';
      for (let i = 0; i < MAX_MISS; i++) x += i < st.missed ? '❌' : '⭕';
      emoji(x, W / 2, SAFE_T + 14, 14);
      drawFlash(dt);
    },
  };
}

    keys: 'Keyboard: A S D F (or ← ↓ ↑ →)',
    certNote: 'You nailed the riff first time. The band has already printed the tour posters.',
    make: makeGuitarist,
  },
  {
    id: 'pianist', icon: '🎹', title: 'PIANIST', short: 'Play back the tune',
    role: 'CONCERT PIANIST', stamp: '🎹',
    tagline: 'A lesson on a grand piano. The piano plays a phrase; play the very same notes back.',
    how: [['👂', 'Watch and listen — keys <b>light up</b> in order.'], ['🎹', 'Play the same keys back in the <b>same order</b>.'],
          ['📈', 'Phrases get longer: <b>5 rounds</b> to clear.'], ['❤️', 'Three lives. Black keys are never in the tune!']],
    keys: 'Keyboard: A S D F G H J K = the white keys',
    certNote: 'Every phrase played back perfectly, right up to seven notes. The concert hall is booked.',
    make: makePianist,
  },
  {
    id: 'drummer', icon: '🥁', title: 'DRUMMER', short: 'Keep the beat',
    role: 'DRUMMER', stamp: '🥁',
    tagline: 'Behind the kit in a real studio. The beat is written on the screen — hit each drum as the playhead reaches it.',
    how: [['👀', 'The <b>grid</b> shows kick, snare and hat.'], ['▶️', 'A <b>playhead</b> sweeps across the bar.'],
          ['🥁', 'Hit each pad exactly as the playhead arrives.'], ['🎶', 'Nail <b>5 beats</b> to get the gig.']],
    keys: 'Keyboard: Z X C (or ← ↓ →)',
    certNote: 'Five patterns, dead on the beat, no drifting. The band can finally record.',
    make: makeDrummer,
  },
  {
    id: 'singer', icon: '🎤', title: 'SINGER', short: 'Hit the notes',
    role: 'LEAD SINGER', stamp: '🎤',
    tagline: 'A choir audition. Hold your voice on the melody line as it scrolls past — drag up and down to change pitch.',
    how: [['👇', '<b>Hold</b> the screen to sing — let go and you stop.'], ['↕️', 'Drag <b>up and down</b> to change your pitch.'],
          ['🎯', 'Stay inside the <b>blue melody bars</b>.'], ['✅', 'Be in tune <b>68% of the song</b> to pass.']],
    keys: 'Keyboard: hold SPACE to sing, ↑ ↓ for pitch',
    certNote: 'In tune from the first note to the last. You are singing the solo on Friday.',
    make: makeSinger,
  },
  {
    id: 'dancer', icon: '💃', title: 'DANCER', short: 'Copy the moves',
    role: 'DANCER', stamp: '💃',
    tagline: 'A dance rehearsal. The lead dancer pulls a move on every beat — copy it before the next one, and the music speeds up.',
    how: [['🕺', 'The lead dancer shows a <b>move</b>.'], ['👇', 'Tap the <b>matching button</b> before the beat ends.'],
          ['⚡', 'Every correct move makes the music <b>faster</b>.'], ['❌', '<b>18 moves</b> to learn the routine. 4 misses and it is over.']],
    keys: 'Keyboard: ↑ → ← ↓ (or 1 2 3 4)',

  },

/* ======================================================================== *
 *  PROGRESS (your CV)
 * ======================================================================== */
const SAVE_KEY = 'flocade-when-i-grow-up-v1';
let employed = new Set();
function loadCV() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) employed = new Set(JSON.parse(raw).filter((id) => JOBS.some((j) => j.id === id)));
  } catch (e) { employed = new Set(); }
}
function saveCV() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify([...employed])); } catch (e) { /* private mode */ }
}

/* ======================================================================== *
 *  SCREENS
 * ======================================================================== */
const hubEl = document.getElementById('hub');
const introEl = document.getElementById('intro');
const resultEl = document.getElementById('result');
const jobsEl = document.getElementById('jobs');
const cvEl = document.getElementById('cvline');
const backArcade = document.getElementById('backArcade');
const backHub = document.getElementById('backHub');
let curJob = null;

function setNav(inGame) {
  backArcade.classList.toggle('hidden', inGame);
  backHub.classList.toggle('hidden', !inGame);
}
function showOnly(el) {
  for (const s of [hubEl, introEl, resultEl]) s.classList.toggle('hidden', s !== el);
}

function renderHub() {
  jobsEl.innerHTML = '';
  for (const job of JOBS) {
    const done = employed.has(job.id);
    const b = document.createElement('button');
    b.className = 'job' + (done ? ' done' : '');
    b.innerHTML =
      (done ? '<span class="tick">✅</span>' : '') +
      '<span class="ic">' + job.icon + '</span>' +
      '<span class="nm">' + job.title + '</span>' +
      '<span class="dsc">' + (done ? 'EMPLOYED!<br>' + job.short : job.short) + '</span>';
    b.addEventListener('click', () => { SFX.click(); showIntro(job); });
    jobsEl.appendChild(b);
  }
  const n = employed.size;
  cvEl.innerHTML = n === 0
    ? 'MY CV: <b>EMPTY</b> — GO AND GET A JOB!'
    : n === JOBS.length
      ? 'MY CV: <b>ALL 10 JOBS</b> 🏆 YOU CAN BE ANYTHING!'
      : 'MY CV: <b>' + n + '/' + JOBS.length + '</b> JOBS';
}

function showIntro(job) {
  curJob = job;
  document.getElementById('introIcon').textContent = job.icon;
  document.getElementById('introTitle').textContent = job.title;
  document.getElementById('introTag').innerHTML =
    (employed.has(job.id) ? '<b>You already got this job!</b> ' : '') + job.tagline;
  document.getElementById('introHow').innerHTML = job.how
    .map(([ic, t]) => '<div class="howrow"><div class="ic">' + ic + '</div><div>' + t + '</div></div>').join('');
  document.getElementById('introKeys').textContent = job.keys;
  showOnly(introEl);
  setNav(true);
  cur = null;
}

function startJob() {
  if (!curJob) return;
  showOnly(null);
  setNav(true);
  flash.t = 0;
  resize();
  cur = curJob.make();
  if (cur.layout) cur.layout();
  ac();
}

function toHub() {
  if (cur && cur.stop) cur.stop();
  cur = null;
  curJob = null;
  renderHub();
  showOnly(hubEl);
  setNav(false);
}

function succeed() {
  const job = curJob;
  if (cur && cur.stop) cur.stop();
  cur = null;
  if (!job) return;
  const firstEver = employed.size === 0;
  const isNew = !employed.has(job.id);
  employed.add(job.id);
  saveCV();
  const all = employed.size === JOBS.length;
  SFX.win();
  const body = document.getElementById('resultBody');
  body.innerHTML =
    '<div class="title">' + (all ? 'YOU CAN BE<br>ANYTHING!' : 'YOU WIN!<br>YOU GOT THE JOB!') + '</div>' +
    '<div class="cert">' +
      '<div class="stamp">' + job.stamp + '</div>' +
      '<div class="hdr">CERTIFICATE OF EMPLOYMENT</div>' +
      '<div class="role">' + job.role + '</div>' +
      '<div class="note">' + job.certNote + '</div>' +
      '<div class="sig">Signed: The ' + job.title.toLowerCase() + '\'s boss ✒️<br>' +
        'Jobs on your CV: <b>' + employed.size + '/' + JOBS.length + '</b></div>' +
    '</div>' +
    '<p class="sub" style="margin-top:0.8rem;">' + (
      all ? 'Every single job on the list — <b>you are employed everywhere</b>. Nobody in the world has a CV like this.'
        : firstEver && isNew ? 'You got <b>employed</b>, so you have officially <b>won the game</b>! Now go and try the other jobs too.'
        : isNew ? 'A new job for your CV. <b>' + (JOBS.length - employed.size) + '</b> left to try!'
        : 'Employed all over again — that job is definitely yours.'
    ) + '</p>';
  document.getElementById('btnRetry').textContent = 'DO IT AGAIN';
  showOnly(resultEl);
  setNav(true);
}

function failJob(msg) {
  const job = curJob;
  if (cur && cur.stop) cur.stop();
  cur = null;
  if (!job) return;
  SFX.lose();
  const body = document.getElementById('resultBody');
  body.innerHTML =
    '<div class="title" style="color:#ff2e88; text-shadow:3px 3px 0 #1a0b3d;">NOT HIRED<br>YET...</div>' +
    '<div style="font-size:2.6rem; margin:0.4rem 0;">' + job.icon + '</div>' +
    '<p class="sub">' + msg + '</p>' +
    '<p class="keys">Work experience is like that. Have another go — you get better every time.</p>';
  document.getElementById('btnRetry').textContent = 'TRY AGAIN';
  showOnly(resultEl);
  setNav(true);
}

// ------------------------------------------------------------------ buttons
document.getElementById('btnStart').addEventListener('click', () => { SFX.click(); startJob(); });
document.getElementById('btnRetry').addEventListener('click', () => { SFX.click(); startJob(); });
document.getElementById('btnHubFromResult').addEventListener('click', () => { SFX.click(); toHub(); });
backHub.addEventListener('click', () => { SFX.click(); toHub(); });
document.getElementById('btnReset').addEventListener('click', () => {
  if (employed.size === 0) { toast('YOUR CV IS ALREADY EMPTY'); return; }
  employed = new Set(); saveCV(); renderHub(); SFX.bad();
  toast('CV CLEARED — START AGAIN!');
});

/* ======================================================================== *
 *  MAIN LOOP
 * ======================================================================== */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
  last = now;
  if (cur) {
    if (cur.update) cur.update(dt);
    if (cur && cur.draw) cur.draw(dt, now / 1000);
  } else {
    g.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------- boot
loadCV();
renderHub();
showOnly(hubEl);
setNav(false);
resize();

const boot = () => { resize(); requestAnimationFrame(frame); };
if (document.fonts && document.fonts.load) {
  Promise.race([
    Promise.all([
      document.fonts.load('10px "Press Start 2P"'),
      document.fonts.load('12px "Inter"'),
    ]),
    new Promise((r) => setTimeout(r, 1500)),
  ]).then(boot, boot);
} else {
  boot();
}
})();
</script>
