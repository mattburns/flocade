<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Interior Designer — Flocade</title>
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0221;
      --card: #1a0b3d;
      --pink: #ff2e88;
      --cyan: #00f0ff;
      --yellow: #ffe600;
      --text: #e8e6f0;
      --dim: #9b93b8;
      --ink: #4a3b5c;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.9rem;
      flex: 0 0 auto;
    }
    header a, header button.linky {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--cyan);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      text-decoration: none;
      white-space: nowrap;
      padding: 0.4rem 0.2rem;
    }
    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.65rem, 2.6vw, 1rem);
      color: var(--yellow);
      text-shadow: 2px 2px 0 var(--pink);
      flex: 1;
      text-align: center;
      line-height: 1.5;
    }
    header .spacer { min-width: 5.5rem; }
    .hint {
      flex: 0 0 auto;
      text-align: center;
      color: var(--dim);
      font-size: 0.8rem;
      padding: 0 1rem 0.45rem;
      min-height: 1.4rem;
    }
    .hint b { color: var(--cyan); font-weight: 600; }

    /* ---------- World / street view ---------- */
    #worldView { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #street {
      flex: 1;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      border-top: 2px solid var(--card);
    }
    #street.dragging { cursor: grabbing; }
    #streetInner {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      gap: clamp(1.5rem, 5vw, 4rem);
      padding: 0 3rem 12%;
      width: max-content;
      background:
        radial-gradient(ellipse 45% 30% at 18% 22%, rgba(255, 230, 0, 0.35), transparent 70%),
        linear-gradient(#1b0640 0%, #3c0f66 45%, #7a2a8f 68%, #c74e8a 78%, #2a5d34 78.5%, #1e4526 100%);
    }
    /* road */
    #streetInner::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 9%;
      background:
        repeating-linear-gradient(90deg, transparent 0 42px, var(--yellow) 42px 70px, transparent 70px 112px) 50% 50% / 112px 5px no-repeat,
        #2b2438;
      background-repeat: repeat-x, no-repeat;
      background-size: 112px 5px, auto;
      background-position: 0 50%, 0 0;
      border-top: 3px solid #171129;
    }
    .sun {
      position: absolute;
      top: 9%;
      left: 220px;
      width: 74px; height: 74px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 40px 14px rgba(255, 230, 0, 0.5);
    }
    .cloud {
      position: absolute;
      height: 26px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.22);
    }
    .cloud::before {
      content: '';
      position: absolute;
      top: -12px; left: 22%;
      width: 45%; height: 24px;
      border-radius: 20px;
      background: inherit;
    }
    .house {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: clamp(150px, 24vh, 230px);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s;
    }
    .house:active { transform: scale(0.96); }
    .house svg { display: block; width: 100%; height: auto; }
    .house .label {
      display: block;
      margin-top: 0.5rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: var(--text);
      text-align: center;
      text-shadow: 1px 1px 0 #000;
    }

    /* ---------- Room view ---------- */
    #roomView { flex: 1; display: none; flex-direction: column; min-height: 0; }
    #roomView.active { display: flex; }
    #worldView.hiddenView { display: none; }
    #roomWrap { flex: 1; min-height: 0; padding: 0 0.6rem 0.6rem; display: flex; }
    #room {
      position: relative;
      flex: 1;
      min-height: 0;
      border: 3px solid var(--card);
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.12);
      background: #fff;
    }
    .wallSeg { position: absolute; top: 0; height: 58%; background: #fff; }
    .floorSeg { position: absolute; top: 58%; bottom: 0; background: #fff; }
    .skirt {
      position: absolute; top: 58%;
      height: 8px; margin-top: -4px;
      background: #d8d2e0;
      border-top: 2px solid #b9b1c9;
      border-bottom: 2px solid #b9b1c9;
      pointer-events: none;
      z-index: 2;
    }
    /* the small walls between rooms */
    .partition {
      position: absolute;
      top: 0; bottom: 0;
      width: clamp(10px, 2.4%, 20px);
      transform: translateX(-50%);
      background: #f2eef7;
      border-left: 3px solid #b9b1c9;
      border-right: 3px solid #b9b1c9;
      z-index: 4;
      pointer-events: none;
    }
    #room.painting .wallSeg, #room.painting .floorSeg { cursor: crosshair; }

    /* wastepaper bin (drag furniture here to throw it away) */
    #bin {
      position: absolute;
      left: 2%;
      top: 38%;
      width: clamp(40px, 7%, 64px);
      opacity: 0.85;
      transition: transform 0.15s;
      pointer-events: none;
      z-index: 6;
    }
    #bin svg { display: block; width: 100%; height: auto; }
    #bin.hot { transform: scale(1.25) rotate(-8deg); }
    #bin.hot .binBody { fill: #ffb3c9; }

    /* furniture */
    .item {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: default;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.18));
    }
    #room.edit .item { cursor: grab; }
    .item.dragging { cursor: grabbing !important; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.25)); }
    .item svg { display: block; width: 100%; height: auto; pointer-events: none; }
    @keyframes pop { 0% { scale: 0.2; } 70% { scale: 1.15; } 100% { scale: 1; } }
    .item.pop { animation: pop 0.25s ease-out; }
    @keyframes wiggle { 0%,100% { rotate: 0deg; } 25% { rotate: -4deg; } 75% { rotate: 4deg; } }
    .item.wiggle { animation: wiggle 0.3s; }

    /* paintbrush FAB + toolbar */
    #fab {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 62px; height: 62px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: var(--pink);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
      z-index: 30;
    }
    #fab svg { width: 34px; height: 34px; }
    #room.edit #fab { transform: rotate(-20deg) scale(1.08); background: var(--cyan); }
    #toolbar {
      position: absolute;
      left: 10px;
      right: 84px;
      bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 8px;
      z-index: 25;
      pointer-events: none;
    }
    .tool {
      width: clamp(44px, 9vh, 58px);
      height: clamp(44px, 9vh, 58px);
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 6px;
      opacity: 0;
      transform: translateY(30px) scale(0.4);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
      transition-delay: var(--d, 0s);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }
    #room.edit #toolbar { pointer-events: auto; }
    #room.edit .tool { opacity: 1; transform: translateY(0) scale(1); }
    .tool:active { transform: scale(0.9) !important; }
    .tool svg { width: 100%; height: 100%; }
    .tool.roller { background: var(--yellow); }

    /* side panel: furniture catalogs + paint swatches */
    #sidePanel {
      position: absolute;
      top: 3%;
      right: 0;
      bottom: 3%;
      width: min(50%, 250px);
      background: #f4f0fa;
      border: 3px solid var(--ink);
      border-right: none;
      border-radius: 16px 0 0 16px;
      box-shadow: -4px 4px 14px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: stretch;
      z-index: 40;
      transform: translateX(110%);
      transition: transform 0.25s ease-out;
    }
    #sidePanel.open { transform: translateX(0); }
    #panelClose {
      flex: 0 0 34px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem;
      color: var(--ink);
    }
    #panelScroll {
      flex: 1;
      overflow-y: auto;
      touch-action: pan-y;
      padding: 12px 12px 12px 0;
    }
    #panelTitle {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      line-height: 1.7;
      color: var(--ink);
      text-align: center;
      margin-bottom: 10px;
    }
    #panelGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .swatch {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 3px solid #c9c0d8;
      cursor: pointer;
      padding: 0;
    }
    .swatch.sel { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 46, 136, 0.4); }
    .itemBtn {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 3px solid #c9c0d8;
      background: #fff;
      cursor: pointer;
      padding: 5px;
    }
    .itemBtn:active { background: #ffe9f3; }
    .itemBtn svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../../" id="backArcade">&larr; ARCADE</a>
    <button class="linky" id="exitRoom" hidden>&larr; STREET</button>
    <h1 id="title">INTERIOR DESIGNER</h1>
    <span class="spacer"></span>
  </header>
  <div class="hint" id="hint"></div>

  <div id="worldView">
    <div id="street">
      <div id="streetInner">
        <div class="sun"></div>
      </div>
    </div>
  </div>

  <div id="roomView">
    <div id="roomWrap">
      <div id="room">
        <div id="surfaces"></div>
        <div id="bin"></div>
        <div id="items"></div>
        <div id="sidePanel">
          <button id="panelClose" aria-label="Close panel">&gt;</button>
          <div id="panelScroll">
            <p id="panelTitle"></p>
            <div id="panelGrid"></div>
          </div>
        </div>
        <div id="toolbar"></div>
        <button id="fab" aria-label="Paintbrush"></button>
      </div>
    </div>
  </div>

<script>
'use strict';

/* ---------------- tiny sounds ---------------- */
let AC = null;
function blip(freq = 600, dur = 0.07, type = 'square', vol = 0.035) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination);
    o.start();
    o.stop(AC.currentTime + dur);
  } catch (e) { /* sound is optional */ }
}

/* ---------------- patterns (walls & floors) ---------------- */
function pat(w, h, body) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>${body}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

/* ---------------- furniture ---------------- */
const OUT = `stroke='#4a3b5c' stroke-width='4' stroke-linejoin='round'`;

/* ---------------- state ---------------- */
const SAVE_KEY = 'flocade-interior-designer-v1';
let state = { houses: {} };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) state = JSON.parse(raw);
  if (!state || typeof state !== 'object' || !state.houses) state = { houses: {} };
} catch (e) { state = { houses: {} }; }

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
}
function houseState(id) {
  const roomCount = HOUSES.find((h) => h.id === id).rooms.length;
  let hs = state.houses[id];
  if (!hs) {
    hs = state.houses[id] = { rooms: [], items: [] };
  }
  // migrate old saves that had one wall/floor for the whole house
  if (!Array.isArray(hs.rooms)) {
    hs.rooms = [];
    if (hs.wall || hs.floor) {
      for (let i = 0; i < roomCount; i++) hs.rooms.push({ wall: hs.wall || 'white', floor: hs.floor || 'white' });
    }
    delete hs.wall;
    delete hs.floor;
  }
  while (hs.rooms.length < roomCount) hs.rooms.push({ wall: 'white', floor: 'white' });
  if (!Array.isArray(hs.items)) hs.items = [];
  return hs;
}

const street = $('street'), streetInner = $('streetInner');
const room = $('room'), surfaces = $('surfaces');
const itemsLayer = $('items'), bin = $('bin');
const toolbar = $('toolbar'), fab = $('fab');
const sidePanel = $('sidePanel'), panelTitle = $('panelTitle'), panelGrid = $('panelGrid');
const hint = $('hint'), title = $('title');
const exitRoom = $('exitRoom'), backArcade = $('backArcade');

let currentHouse = null;
let editMode = false;
let paintSel = null;
let zTop = 10;
let wallEls = [], floorEls = [];

/* ---------------- world / street ---------------- */
bin.innerHTML = BIN_SVG;
fab.innerHTML = ICON_BRUSH;

for (let i = 0; i < 3; i++) {
  const c = document.createElement('div');
  c.className = 'cloud';
  c.style.width = 90 + i * 40 + 'px';
  c.style.top = 6 + i * 9 + '%';
  c.style.left = 450 + i * 620 + 'px';
  streetInner.appendChild(c);
}
HOUSES.forEach((h, i) => {
  const b = document.createElement('button');
  b.className = 'house';
  b.style.marginBottom = (i % 2 ? 0 : 2) + '%';
  b.innerHTML = houseSVG(h, i) + `<span class="label">${h.name}</span>`;
  b.addEventListener('click', () => { blip(700, 0.08, 'triangle'); enterHouse(h); });
  streetInner.appendChild(b);
});

// mouse drag-to-pan (touch scrolls natively)
let panning = false, panX = 0, panScroll = 0, panMoved = false;
street.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') return;
  panning = true; panMoved = false;
  panX = e.clientX; panScroll = street.scrollLeft;
  street.classList.add('dragging');
});
window.addEventListener('pointermove', (e) => {
  if (!panning) return;
  const dx = e.clientX - panX;
  if (Math.abs(dx) > 4) panMoved = true;
  street.scrollLeft = panScroll - dx;
});
window.addEventListener('pointerup', () => { panning = false; street.classList.remove('dragging'); });
// stop a drag-pan from "clicking" a house
streetInner.addEventListener('click', (e) => { if (panMoved) { e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------------- room ---------------- */
function setHint(html) { hint.innerHTML = html; }

function enterHouse(h) {
  currentHouse = h;
  worldView.classList.add('hiddenView');
  roomView.classList.add('active');
  backArcade.hidden = true;
  exitRoom.hidden = false;
  title.textContent = h.name;
  setEditMode(false);
  renderRoom();
  setHint('Press the <b>paintbrush</b> in the corner!');
}

function leaveHouse() {
  currentHouse = null;
  setEditMode(false);
  roomView.classList.remove('active');
  worldView.classList.remove('hiddenView');
  backArcade.hidden = false;
  exitRoom.hidden = true;
  title.textContent = 'INTERIOR DESIGNER';
  setHint('Every house is empty… tap one to decorate it!');
  blip(500, 0.08, 'triangle');
}
exitRoom.addEventListener('click', leaveHouse);

/* build one wall + floor segment per room, with small walls between them */
function buildSurfaces() {
  surfaces.innerHTML = '';
  wallEls = []; floorEls = [];
  let x = 0;
  currentHouse.rooms.forEach((w, i) => {
    const wallSeg = document.createElement('div');
    wallSeg.className = 'wallSeg';
    wallSeg.style.left = x + '%';
    wallSeg.style.width = w + '%';
    wallSeg.addEventListener('click', () => paintSurface(i, 'wall'));

    const floorSeg = document.createElement('div');
    floorSeg.className = 'floorSeg';
    floorSeg.style.left = x + '%';
    floorSeg.style.width = w + '%';
    floorSeg.addEventListener('click', () => paintSurface(i, 'floor'));

    const skirt = document.createElement('div');
    skirt.className = 'skirt';
    skirt.style.left = x + '%';
    skirt.style.width = w + '%';

    surfaces.append(wallSeg, floorSeg, skirt);
    wallEls.push(wallSeg);
    floorEls.push(floorSeg);
    x += w;

    if (i < currentHouse.rooms.length - 1) {
      const part = document.createElement('div');
      part.className = 'partition';
      part.style.left = x + '%';
      surfaces.appendChild(part);
    }
  });
}

function applySurfaces() {
  const hs = houseState(currentHouse.id);
  hs.rooms.forEach((r, i) => {
    if (wallEls[i]) wallEls[i].style.background = (PATTERNS[r.wall] || PATTERNS.white).css;
    if (floorEls[i]) floorEls[i].style.background = (PATTERNS[r.floor] || PATTERNS.white).css;
  });
}

function renderRoom() {
  buildSurfaces();
  applySurfaces();
  itemsLayer.innerHTML = '';
  houseState(currentHouse.id).items.forEach((it) => {
    if (FURNITURE[it.t]) itemsLayer.appendChild(makeItemEl(it));
  });
}

/* ---------------- edit mode / toolbar ---------------- */
const TOOL_ORDER = ['bed', 'toilet', 'fridge', 'sofa', 'tv'];
TOOL_ORDER.forEach((cat, i) => {
  const b = document.createElement('button');
  b.className = 'tool';
  b.style.setProperty('--d', i * 0.04 + 's');
  b.innerHTML = itemSVG(cat, true);
  b.title = cat;
  b.addEventListener('click', () => openCatalog(cat));
  toolbar.appendChild(b);
});
const rollerBtn = document.createElement('button');
rollerBtn.className = 'tool roller';
rollerBtn.style.setProperty('--d', TOOL_ORDER.length * 0.04 + 's');
rollerBtn.innerHTML = ICON_ROLLER;
rollerBtn.title = 'paint';
rollerBtn.addEventListener('click', openSwatches);
toolbar.appendChild(rollerBtn);

fab.addEventListener('click', () => setEditMode(!editMode));

function setEditMode(on) {
  editMode = on;
  room.classList.toggle('edit', on);
  if (on) {
    blip(880, 0.09, 'triangle');
    setHint('Tap a button for furniture, or the <b>roller</b> to paint!');
  } else {
    closePanel();
  }
}

/* ---------------- side panel (catalogs + swatches) ---------------- */
function openCatalog(cat) {
  blip(760, 0.07);
  paintSel = null;
  room.classList.remove('painting');
  const c = CATALOGS[cat];
  panelTitle.innerHTML = c.title;
  panelGrid.innerHTML = '';
  c.items.forEach((type) => {
    const b = document.createElement('button');
    b.className = 'itemBtn';
    b.innerHTML = itemSVG(type, true);
    b.addEventListener('click', () => spawnItem(type));
    panelGrid.appendChild(b);
  });
  sidePanel.classList.add('open');
  setHint('Tap things to add them, then <b>drag</b> them where you like!');
}

function openSwatches() {
  blip(760, 0.07);
  panelTitle.innerHTML = 'PICK A STYLE,<br>THEN TAP A ROOM&rsquo;S<br>WALL OR FLOOR!';
  panelGrid.innerHTML = '';
  Object.keys(PATTERNS).forEach((id) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (paintSel === id ? ' sel' : '');
    b.style.background = PATTERNS[id].css;
    b.addEventListener('click', () => {
      paintSel = id;
      blip(920, 0.06);
      [...panelGrid.children].forEach((c) => c.classList.remove('sel'));
      b.classList.add('sel');
      room.classList.add('painting');
      setHint('Now tap a room&rsquo;s <b>wall</b> or <b>floor</b> — it only paints that room!');
    });
    panelGrid.appendChild(b);
  });
  sidePanel.classList.add('open');
  setHint('Pick a style, then tap a room&rsquo;s <b>wall</b> or <b>floor</b>!');
}

function closePanel() {
  sidePanel.classList.remove('open');
  paintSel = null;
  room.classList.remove('painting');
}
$('panelClose').addEventListener('click', () => { blip(440, 0.06); closePanel(); });

function paintSurface(roomIdx, which) {
  if (!paintSel || !currentHouse) return;
  houseState(currentHouse.id).rooms[roomIdx][which] = paintSel;
  applySurfaces();
  save();
  blip(which === 'wall' ? 990 : 660, 0.12, 'sine', 0.05);
}

/* ---------------- furniture: spawn / drag / flip / bin ---------------- */
function spawnItem(type) {
  const hs = houseState(currentHouse.id);
  if (hs.items.length >= 40) { blip(160, 0.15, 'sawtooth'); setHint('This house is FULL! Bin something first.'); return; }
  const hangs = type === 'pendant' || type === 'mirror' || type === 'towel' || type === 'tv';
  const it = {
    t: type,
    x: 25 + Math.random() * 50,
    y: hangs ? 28 + Math.random() * 18 : 68 + Math.random() * 24,
    f: 1,
    z: ++zTop,
  };
  hs.items.push(it);
  const el = makeItemEl(it);
  el.classList.add('pop');
  itemsLayer.appendChild(el);
  save();
  blip(700 + Math.random() * 200, 0.1, 'triangle', 0.05);
}

function makeItemEl(it) {
  const el = document.createElement('div');
  el.className = 'item';
  el.style.width = FURNITURE[it.t].w + '%';
  el.innerHTML = itemSVG(it.t);
  it.z = it.z || ++zTop;
  zTop = Math.max(zTop, it.z);
  positionItem(el, it);
  el.addEventListener('pointerdown', (e) => onItemDown(e, el, it));
  return el;
}

function positionItem(el, it) {
  el.style.left = it.x + '%';
  el.style.top = it.y + '%';
  el.style.zIndex = it.z;
  el.style.transform = `translate(-50%, -100%) scaleX(${it.f})`;
}

function overBin(e) {
  const r = bin.getBoundingClientRect();
  return e.clientX > r.left - 20 && e.clientX < r.right + 20 &&
         e.clientY > r.top - 20 && e.clientY < r.bottom + 20;
}

function onItemDown(e, el, it) {
  if (!editMode) {
    el.classList.remove('wiggle');
    void el.offsetWidth;
    el.classList.add('wiggle');
    blip(300, 0.05, 'triangle');
    return;
  }
  e.preventDefault();
  e.stopPropagation();
  it.z = ++zTop;
  el.style.zIndex = it.z;
  const roomRect = room.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  const origX = it.x, origY = it.y;
  let moved = false;
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');

  const onMove = (ev) => {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    it.x = Math.min(98, Math.max(2, origX + (dx / roomRect.width) * 100));
    it.y = Math.min(99, Math.max(8, origY + (dy / roomRect.height) * 100));
    positionItem(el, it);
    bin.classList.toggle('hot', overBin(ev));
  };
  const onUp = (ev) => {
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onUp);
    el.classList.remove('dragging');
    bin.classList.remove('hot');
    const hs = houseState(currentHouse.id);
    if (moved && overBin(ev)) {
      hs.items = hs.items.filter((x) => x !== it);
      el.remove();
      blip(220, 0.18, 'sawtooth', 0.05);
      save();
      return;
    }
    if (!moved) {
      it.f *= -1; // tap = flip
      positionItem(el, it);
      blip(540, 0.06);
    }
    save();
  };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
}

/* ---------------- keyboard ---------------- */
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (sidePanel.classList.contains('open')) closePanel();
    else if (editMode) setEditMode(false);
    else if (currentHouse) leaveHouse();
  }
  if (!currentHouse) {
    if (e.key === 'ArrowRight') street.scrollLeft += 120;
    if (e.key === 'ArrowLeft') street.scrollLeft -= 120;
  }
});

setHint('Every house is empty… tap one to decorate it!');
</script>
</body>
</html>
