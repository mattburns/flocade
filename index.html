<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flocade — Flo's Arcade</title>
  <meta name="description" content="Flocade: a gallery of simple web games that are free and awesome.">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0221">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <header class="site-header">
    <h1 class="logo glitch">FLOCADE</h1>
    <p class="tagline">Flo's Arcade — free games, zero nonsense</p>
    <div id="install-pill" class="install-pill" hidden>
      <button id="install-button" class="install-action" hidden>🕹️ GET THE APP</button>
      <span id="install-ios-hint" class="install-ios-hint" hidden>
        🕹️ Get the app: tap <strong>Share</strong> <svg class="share-glyph" aria-hidden="true" viewBox="0 0 16 20" width="12" height="15"><path fill="currentColor" d="M8 0l4 4-1.06 1.06L8.75 2.87V13h-1.5V2.87L5.06 5.06 4 4l4-4zM2 7h3v1.5H3.5v10h9v-10H11V7h3v13H2V7z"/></svg> then <strong>Add&nbsp;to&nbsp;Home&nbsp;Screen</strong>
      </span>
      <button id="install-dismiss" class="install-dismiss" aria-label="Dismiss install suggestion">✕</button>
    </div>
  </header>

  <main>
    <section id="gallery" class="gallery" aria-label="Game gallery">
      <!-- Game cards are rendered here by js/main.js -->
    </section>
  </main>

  <footer class="site-footer">
    <p>Made with ❤️ &middot; <a href="https://github.com/mattburns/flocade">Source on GitHub</a></p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
